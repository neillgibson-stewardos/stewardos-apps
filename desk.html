<!doctype html>
<html lang="en" data-theme="brass" data-family="object" data-shelf="spines">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23775021%22/%3E%3C/svg%3E">
<title>StewardOS Desk · v0.4 prototype (sample data)</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.42 var(--f-body);color:var(--desk-ink);background:var(--bg);background-color:var(--bg-solid);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ---------- header ---------- */
.hdr{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--hdr-bg);color:var(--hdr-ink);border-bottom:1px solid var(--hdr-line);flex:0 0 auto;position:relative;z-index:5;backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:34px;height:34px;border:1.5px solid currentColor;border-radius:calc(var(--radius)*.7);display:grid;place-items:center;flex:0 0 auto}
.brand .mark svg{width:22px;height:22px}
.brand b{font-family:var(--f-display);font-size:19px;display:block;line-height:1.1;white-space:nowrap}
.brand small{font-size:11px;opacity:.8;white-space:nowrap}
.grow{flex:1}
.hdr .setup{background:none;border:1px solid var(--hdr-line);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12px;white-space:nowrap}
.vault{font-size:12px;opacity:.85;white-space:nowrap}
.vault i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:0}
.hint{font-size:12px;opacity:.85;white-space:nowrap}
.hint.live{opacity:1;color:var(--accent-hi)}
.hdr select{background:var(--surface);border:1px solid var(--hdr-line);border-radius:6px;padding:3px 6px;font-size:12px;max-width:200px;color:var(--ink)}
.hdr .iconbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--hdr-line);background:none;cursor:pointer;font-weight:700}
.clock{font:600 13px var(--f-mono);white-space:nowrap}
.kbd,kbd{font:600 11px var(--f-mono);border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.95}

/* ---------- desk grid ---------- */
.desk{flex:1;min-height:0;display:grid;gap:12px 16px;padding:12px 18px 10px;
  grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,.9fr) minmax(0,.9fr);
  grid-template-rows:minmax(150px,.95fr) minmax(0,1fr) minmax(0,1fr) auto auto;
  grid-template-areas:"shelf shelf back1 back2" "left1 center right1 open1" "left2 center right2 open2" "capture capture capture capture" "drawer drawer drawer drawer"}
html[data-family=instrument] .desk{grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.15fr);grid-template-rows:auto minmax(0,1fr) minmax(0,1fr) auto auto;
  grid-template-areas:"shelf shelf shelf center" "left1 right1 back1 center" "left2 right2 back2 center" "open1 open2 capture capture" "drawer drawer drawer drawer"}
html[data-family=orbital] .desk{grid-template-columns:minmax(0,.9fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);grid-template-rows:repeat(4,minmax(0,1fr)) auto auto;
  grid-template-areas:"back1 shelf shelf center" "back2 shelf shelf center" "left1 shelf shelf right1" "left2 open1 open2 right2" "capture capture capture capture" "drawer drawer drawer drawer"}
html[data-family=terminal] .desk{gap:8px;grid-template-columns:minmax(0,.9fr) repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr)) auto auto;
  grid-template-areas:"shelf center center right1" "shelf left1 left2 right2" "shelf back1 back2 open1" "capture capture capture open2" "drawer drawer drawer drawer"}
html[data-family=modular] .desk{grid-template-columns:minmax(0,.95fr) minmax(0,1.25fr) minmax(0,.9fr) minmax(0,.9fr)}

.shelf{grid-area:shelf;min-width:0;min-height:0;display:flex;flex-direction:column}
.ov{grid-area:center}
.capture{grid-area:capture}.drawer{grid-area:drawer}
[data-slot=left-1]{grid-area:left1}[data-slot=left-2]{grid-area:left2}[data-slot=right-1]{grid-area:right1}[data-slot=right-2]{grid-area:right2}
[data-slot=back-1]{grid-area:back1}[data-slot=back-2]{grid-area:back2}[data-slot=open-1]{grid-area:open1}[data-slot=open-2]{grid-area:open2}

/* ---------- shelf ---------- */
.shelf-head{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--desk-muted)}
.shelf-head b{font-weight:700}
.books{flex:1;min-height:0;display:flex;align-items:flex-end;gap:4px;padding:6px 8px 0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.book{flex:0 0 auto;position:relative;cursor:pointer;border:0;padding:0}
.book .alert{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--alert);color:#fff;font:700 10px/16px var(--f-body);text-align:center;writing-mode:horizontal-tb;padding:0 3px;box-shadow:0 0 0 2px var(--bg-solid)}
.plank{height:12px;margin:0 2px;border-radius:2px;background:var(--plank);box-shadow:0 5px 10px rgba(0,0,0,.35)}
/* spines */
html[data-shelf=spines] .book{width:44px;height:calc(var(--h,1) * clamp(108px,19vh,180px));writing-mode:vertical-rl;display:flex;align-items:center;justify-content:space-between;padding:12px 0 8px;border-radius:3px 3px 1px 1px;
  background:linear-gradient(90deg,rgba(0,0,0,.38),rgba(255,255,255,.14) 16%,rgba(255,255,255,0) 42%,rgba(0,0,0,.28)),var(--c);color:var(--spine-ink);font:600 13px/1 var(--f-display);letter-spacing:.02em;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),2px 0 3px rgba(0,0,0,.35);transition:transform var(--t-fast) ease}
html[data-shelf=spines] .book::before,html[data-shelf=spines] .book::after{content:"";position:absolute;left:4px;right:4px;height:2px;background:var(--metal);opacity:.75}
html[data-shelf=spines] .book::before{top:6px}html[data-shelf=spines] .book::after{bottom:24px}
html[data-shelf=spines] .book:hover,html[data-shelf=spines] .book:focus-visible{transform:translateY(-7px)}
html[data-shelf=spines] .book .nm{max-height:calc(100% - 26px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
html[data-shelf=spines] .book .num{writing-mode:horizontal-tb;font:700 10px var(--f-mono);opacity:.9}
html[data-shelf=spines] .book.more{background:none;box-shadow:none;border:1.5px dashed var(--desk-muted);color:var(--desk-ink)}
html[data-shelf=spines] .book.more::before,html[data-shelf=spines] .book.more::after{display:none}
html[data-family=line] .book{--c:var(--bg-solid)!important;box-shadow:none!important;border:1.5px solid var(--art-st)!important;color:var(--desk-ink)!important;background:var(--bg-solid)!important;text-transform:uppercase;font-family:var(--f-mono)!important;font-size:11px!important;letter-spacing:.08em!important}
html[data-family=line] .book::before,html[data-family=line] .book::after{background:var(--art-st)!important;height:1px!important}
html[data-family=line] .plank{background:none;border:1.5px solid var(--art-st);border-radius:0;box-shadow:none;height:10px}
/* tiles / carousel */
html[data-shelf=tiles] .books,html[data-shelf=carousel] .books{align-items:stretch;padding:6px 0 2px;gap:8px}
html[data-shelf=tiles] .book,html[data-shelf=carousel] .book{width:104px;min-height:68px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:8px 9px;border-radius:var(--radius);background:var(--card);border:1px solid var(--card-line);color:var(--card-ink);text-align:left;font-size:12px;box-shadow:var(--card-shadow);backdrop-filter:var(--card-blur)}
html[data-shelf=tiles] .book .mono,html[data-shelf=carousel] .book .mono{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--f-display);border:1.5px solid var(--accent);color:var(--accent)}
html[data-shelf=tiles] .book .num,html[data-shelf=carousel] .book .num{position:absolute;bottom:6px;right:8px;font:600 10px var(--f-mono);opacity:.7}
html[data-shelf=tiles] .book .nm,html[data-shelf=carousel] .book .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
html[data-shelf=tiles] .book:hover,html[data-shelf=carousel] .book:hover{border-color:var(--accent)}
html[data-shelf=tiles] .book.more,html[data-shelf=carousel] .book.more{align-items:center;justify-content:center;border-style:dashed;font-weight:700;color:var(--accent)}
html[data-shelf=carousel] .book{width:118px}
html:not([data-shelf=spines]) .plank{display:none}
html:not([data-shelf=tiles]):not([data-shelf=carousel]):not([data-shelf=ring]) .book .mono{display:none}
/* list */
html[data-shelf=list] .books{flex-direction:column;align-items:stretch;gap:0;overflow-y:auto;overflow-x:hidden;padding:4px 0}
html[data-shelf=list] .book{display:flex;align-items:center;gap:8px;padding:4px 6px;background:none;color:var(--desk-ink);text-align:left;border-bottom:1px solid var(--card-line);font-size:13px}
html[data-shelf=list] .book .num{order:-1;font:600 11px var(--f-mono);width:22px;opacity:.8}
html[data-shelf=list] .book .nm{flex:1}
html[data-shelf=list] .book .alert{position:static;box-shadow:none}
html[data-shelf=list] .book:hover,html[data-shelf=list] .book:focus-visible{background:var(--card)}
html[data-shelf=list] .book.more{color:var(--accent);font-weight:700}
/* ring */
html[data-shelf=ring] .books{position:relative;display:block;padding:0;overflow:visible;margin-top:18px}
html[data-shelf=ring] .ringhub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(34vh,40%);aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--edge);display:grid;place-items:center;text-align:center;color:var(--desk-muted);font-size:12px}
html[data-shelf=ring] .ringhub .art{display:flex;flex-direction:column;align-items:center;width:100%;height:100%;justify-content:center}html[data-shelf=ring] .ringhub svg{width:58%;height:58%}
html[data-shelf=ring] .book{position:absolute;transform:translate(-50%,-50%);width:92px;padding:7px 6px;border-radius:999px;background:var(--card);border:1px solid var(--card-line);color:var(--card-ink);display:flex;align-items:center;gap:6px;font-size:12px;box-shadow:var(--card-shadow)}
html[data-shelf=ring] .book .mono{width:20px;height:20px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font:700 11px var(--f-display);background:var(--accent);color:var(--accent-ink)}
html[data-shelf=ring] .book .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-shelf=ring] .book .num{display:none}
html[data-shelf=ring] .book:hover{border-color:var(--accent)}

/* ---------- tool objects ---------- */
.slot{position:relative;min-width:0;min-height:0;display:flex}
.tool{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;background:none;border:0;padding:6px;border-radius:var(--radius);cursor:pointer;color:var(--desk-ink);text-align:center;position:relative}
.tool .art{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;transition:transform var(--t-fast) ease}
.tool:hover .art,.tool:focus-visible .art{transform:translateY(-3px) scale(1.03)}
.tool .art svg{width:100%;height:100%;max-height:150px;overflow:visible;filter:var(--art-shadow)}
.tool .art pre{display:none}
.tlabel{display:inline-flex;align-items:center;gap:7px;font:600 14px var(--f-display);color:var(--desk-ink);text-shadow:var(--label-shadow)}
.key{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:5px;background:var(--key-bg);color:var(--key-ink);border:1px solid var(--key-line);font:700 12px var(--f-mono);box-shadow:0 1px 0 rgba(0,0,0,.25);text-shadow:none}
.feed{font-size:12px;line-height:1.3;background:var(--feed-bg);color:var(--feed-ink);padding:4px 9px;border-radius:6px;max-width:100%;box-shadow:var(--feed-shadow)}
.feed b{display:block;font-weight:700}
.feed span{display:block;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbadge{display:inline-block;min-width:20px;height:20px;border-radius:10px;padding:0 6px;background:var(--attention);color:#fff;font:700 11px/20px var(--f-body);box-shadow:0 0 0 2px var(--bg-solid)}
.slot .hide{position:absolute;top:4px;left:4px;z-index:2;opacity:0;border:1px solid var(--desk-muted);background:var(--bg-solid);color:var(--desk-ink);border-radius:999px;font-size:11px;padding:1px 7px;cursor:pointer}
.slot:hover .hide,.slot:focus-within .hide{opacity:.9}
.slot.empty{border:1.5px dashed var(--desk-muted);border-radius:var(--radius);align-items:center;justify-content:center;color:var(--desk-muted);font-size:12px;opacity:.75;text-align:center;padding:6px}
html[data-family=instrument] .tool,html[data-family=modular] .tool,html[data-family=orbital] .tool{background:var(--card);border:1px solid var(--card-line);box-shadow:var(--card-shadow);color:var(--card-ink);backdrop-filter:var(--card-blur)}
html[data-family=instrument] .tool .art svg{max-height:96px}
html[data-family=instrument] .tlabel,html[data-family=modular] .tlabel,html[data-family=orbital] .tlabel{color:var(--card-ink);text-shadow:none}
html[data-family=modular] .slot{background:var(--well);border-radius:calc(var(--radius) + 4px);padding:6px;box-shadow:inset 0 3px 8px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.05)}
html[data-family=modular] .slot.empty{background:var(--well)}
html[data-family=line] .tlabel{font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;border:1px solid var(--art-st);padding:2px 8px}
html[data-family=line] .key{background:none;color:var(--desk-ink);border-color:var(--desk-ink);box-shadow:none}
html[data-family=terminal] .tool{border:1px solid var(--card-line);border-radius:0;justify-content:flex-start;align-items:stretch;text-align:left;padding:4px 8px}
html[data-family=terminal] .tool .art{order:2;justify-content:flex-start}
html[data-family=terminal] .tool .art svg{display:none}
html[data-family=terminal] .tool .art pre{display:block;margin:0;font:12px/1.15 var(--f-mono);color:var(--desk-muted)}
html[data-family=terminal] .tlabel{order:0;font:700 13px var(--f-mono);text-transform:uppercase;border-bottom:1px solid var(--card-line);padding-bottom:3px;width:100%}
html[data-family=terminal] .key{display:inline;background:none;border:0;color:var(--desk-ink);box-shadow:none;padding:0;min-width:0;height:auto}
html[data-family=terminal] .key::before{content:"["}html[data-family=terminal] .key::after{content:"]"}
html[data-family=terminal] .feed{order:1;background:none;padding:0;color:var(--desk-ink)}
html[data-family=terminal] *{font-family:var(--f-mono)!important}

/* art paint (one SVG set, recolored by family/theme tokens) */
.art svg *{vector-effect:non-scaling-stroke;stroke:var(--art-st);stroke-width:var(--sw);stroke-linejoin:round;stroke-linecap:round}
.art .pap{fill:var(--paper)}.art .pap2{fill:var(--paper2)}.art .lea{fill:var(--leather)}.art .lea2{fill:var(--leather2)}.art .met{fill:var(--metal)}.art .cork{fill:var(--cork)}.art .acc{fill:var(--accent2)}
.art .glass{fill:var(--glass)}.art .nf{fill:none}.art .thin{fill:none;stroke-width:calc(var(--sw) * .65);opacity:.75}.art .ns{stroke:none}
.art .inkf{fill:var(--art-st);stroke:none}
html[data-family=line] .art .pap,html[data-family=line] .art .pap2,html[data-family=line] .art .lea,html[data-family=line] .art .lea2,html[data-family=line] .art .met,html[data-family=line] .art .cork,html[data-family=line] .art .glass{fill:var(--bg-solid)}
html[data-family=line] .art .acc{fill:var(--art-st)}
html[data-family=instrument] .art .pap,html[data-family=instrument] .art .pap2,html[data-family=instrument] .art .lea,html[data-family=instrument] .art .lea2,html[data-family=instrument] .art .met,html[data-family=instrument] .art .cork,html[data-family=instrument] .art .glass,
html[data-family=orbital] .art .lea2,html[data-family=orbital] .art .glass{fill:color-mix(in srgb,var(--art-st) 10%,transparent)}

/* ---------- overview (center) ---------- */
.ov{min-height:0;overflow:auto;border-radius:var(--radius);background:var(--ov-bg);color:var(--ov-ink);padding:14px 18px;box-shadow:var(--ov-shadow);border:var(--ov-border);backdrop-filter:var(--card-blur)}
.ov h3{margin:0 0 6px;font:600 16px var(--f-display);display:flex;align-items:center;gap:8px}
.ov ul{list-style:none;margin:0 0 10px;padding:0}
.ov li button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:baseline;width:100%;padding:3px 2px;border-radius:4px;box-sizing:border-box}
.ov li button:hover,.ov li button:focus-visible{background:color-mix(in srgb,var(--ov-ink) 8%,transparent);outline:none}
.ov li .t{font:600 12px var(--f-mono);min-width:66px;opacity:.75}
.ov li .sev{width:16px;text-align:center;font-weight:700}
.ov .pages{display:grid;grid-template-columns:1fr 1fr;gap:26px}
html[data-family=object] .ov{background:linear-gradient(90deg,rgba(0,0,0,.0) 0 48.6%,rgba(0,0,0,.16) 49.6%,rgba(0,0,0,.05) 50.4%,rgba(0,0,0,0) 51.4%),var(--ov-bg);box-shadow:0 14px 24px rgba(0,0,0,.4),inset 0 0 40px rgba(120,80,30,.18);border-radius:4px}
.ov .verse{font:italic 13px/1.4 var(--f-display);opacity:.8;margin:6px 0 0}
.sample{font:600 9.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;border:1px dashed currentColor;border-radius:4px;padding:1px 5px;opacity:.75;white-space:nowrap}

/* ---------- capture + drawer ---------- */
.capture{align-self:center;display:flex;gap:8px;align-items:center;background:var(--cap-bg);border:1px solid var(--card-line);border-radius:999px;padding:5px 6px 5px 14px;color:var(--cap-ink);backdrop-filter:var(--card-blur)}
.capture input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:14px;color:var(--cap-ink)}
.capture input::placeholder{color:color-mix(in srgb,var(--cap-ink) 55%,transparent)}
.capture .lbl{font-size:12px;font-weight:700;white-space:nowrap;opacity:.8}
html[data-family=terminal] .capture{border-radius:0}
.drawer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--desk-muted);border-top:1px dashed color-mix(in srgb,var(--desk-muted) 60%,transparent);padding-top:6px}
.drawer .dchip{border:1px solid var(--desk-muted);background:none;color:var(--desk-ink);border-radius:999px;padding:2px 9px;cursor:pointer;font-size:12px}
.drawer .dchip.min{border-style:dashed}
.drawer .note{margin-left:auto;opacity:.85}

/* ---------- windows ---------- */
.win{position:fixed;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border:1px solid var(--edge);border-radius:var(--radius);box-shadow:0 16px 44px rgba(0,0,0,.42);min-width:300px;min-height:200px;overflow:hidden;font-family:var(--f-body)}
.win.focused{box-shadow:0 22px 60px rgba(0,0,0,.55),0 0 0 1px var(--accent)}
.win.min{display:none}
.titlebar{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;background:var(--surface2);border-bottom:1px solid var(--edge);cursor:grab;user-select:none;touch-action:none;flex:0 0 auto}
.titlebar:active{cursor:grabbing}
.titlebar h2{font:600 14px var(--f-display);margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titlebar .wk{font-size:11px;opacity:.7}
.wbtn{width:26px;height:26px;border-radius:6px;border:1px solid transparent;background:none;cursor:pointer;font-size:16px;line-height:1;color:var(--ink)}
.wbtn:hover{border-color:var(--edge)}
.wbody{flex:1;min-height:0;overflow:auto;padding:12px 14px}
.wbody.flush{padding:0;display:flex;flex-direction:column}
.resize{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 55%,var(--edge) 56% 62%,transparent 63% 72%,var(--edge) 73% 79%,transparent 80%)}
.win .muted,.sheet .muted{color:var(--muted)}
.btn{background:var(--surface);border:1px solid var(--edge);color:var(--ink);border-radius:calc(var(--radius) * .6 + 2px);padding:5px 11px;cursor:pointer;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.small{padding:2px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}

function shelfSets(){
  const all=stewardships(), S=sceneOf(), vis=S?(S.spines.quads||S.spines.rects).length:themeOf(state.theme).vis;
  const pins=state.pins.map(stById).filter(s=>s&&all.includes(s));
  const rest=all.filter(s=>!pins.includes(s)).sort((a,b)=>(state.usage[b.id]||0)-(state.usage[a.id]||0)||a.name.localeCompare(b.name));
  const ordered=[...pins,...rest];
  if(ordered.length<=vis) return {visible:ordered,hidden:0,all};
  return {visible:ordered.slice(0,vis-1),hidden:ordered.length-(vis-1),all};
}

function wireDesk(){
  const desk=$('#desk');

    const b=e.target.closest('button,a,[role=button]'); if(!b) return;
    if(b.dataset.cap){const i=$('#capIn');i&&i.focus();return}
    if(b.dataset.hide){hideTool(b.dataset.hide);return}
    if(b.dataset.tool){openTool(b.dataset.tool);return}
    if(b.dataset.more){openPicker();return}
    if(b.dataset.st){openStewardship(b.dataset.st,{forceNew:e.metaKey||e.ctrlKey});return}
    if(b.dataset.place){placeTool(b.dataset.place);return}
    if(b.dataset.restore){const r=WINS.get(b.dataset.restore);if(r){r.el.classList.remove('min');focusWin(r.id);refreshFeeds()}return}
    if(b.dataset.openSt){openStewardship(b.dataset.openSt);return}
    if(b.dataset.go){e.preventDefault();b.dataset.go==='review'?showReview(true):runKey(b.dataset.go)}
  });
  desk.addEventListener('submit',e=>{
    if(e.target.id!=='capForm')return; e.preventDefault();
    const inp=$('#capIn'),txt=inp.value.trim(); if(!txt)return;
    const en=addEntry(txt,'note'); inp.value='';
    toast('Saved to Journal inbox (unfiled).',{action:'File…',onAction:()=>openFiling({entryId:en.id}),ms:7000});
  });
  desk.addEventListener('keydown',e=>{
    const t=e.target;
    if(t.getAttribute&&t.getAttribute('role')==='button'&&(e.key==='Enter'||e.key===' ')&&!e.metaKey&&!e.ctrlKey){e.preventDefault();e.stopPropagation();t.click();return}
    if(t.classList&&t.classList.contains('tool')&&(e.key==='Delete'||e.key==='Backspace')){e.preventDefault();hideTool(t.dataset.tool);return}
    if(t.classList&&t.classList.contains('book')&&(e.key==='ArrowRight'||e.key==='ArrowLeft'||e.key==='ArrowDown'||e.key==='ArrowUp')){
      const bs=$$('.book',desk),i=bs.indexOf(t),n=bs[(i+((e.key==='ArrowRight'||e.key==='ArrowDown')?1:-1)+bs.length)%bs.length];n&&n.focus();e.preventDefault();return}
    if(t.classList&&t.classList.contains('tool')&&e.key.startsWith('Arrow')){
      const ts=$$('.tool',desk),i=ts.indexOf(t),n=ts[(i+((e.key==='ArrowRight'||e.key==='ArrowDown')?1:-1)+ts.length)%ts.length];n&&n.focus();e.preventDefault();}
  });
  $('#setupBtn').addEventListener('click',openSetups);
  $('#keysBtn').addEventListener('click',openKeys);
}

/* ================= WINDOW MANAGER (in-page windows) ================= */
const WINS=new Map(); let Z=100; let focusHist=[];
function cascade(w,h){
  const vw=innerWidth,vh=innerHeight,n=[...WINS.values()].filter(r=>!r.el.classList.contains('min')).length;
  w=Math.min(w,vw-24);h=Math.min(h,vh-70);
  let x=Math.round((vw-w)/2)-90+n*30,y=58+n*30;
  if(x+w>vw-8)x=Math.max(8,vw-w-8); if(x<8)x=8; if(y+h>vh-8)y=Math.max(50,vh-h-8);
  return {x,y,w,h};
}
function clampFrame(f){const vw=innerWidth,vh=innerHeight;const w=Math.min(f.w,vw-16),h=Math.min(f.h,vh-56);return {w,h,x:Math.min(Math.max(f.x,8-w+120),vw-120),y:Math.min(Math.max(f.y,48),vh-40)}}
function setFrame(el,f){f=clampFrame(f);Object.assign(el.style,{left:f.x+'px',top:f.y+'px',width:f.w+'px',height:f.h+'px'})}
function frameOf(el){const r=el.getBoundingClientRect();return {x:Math.round(r.left),y:Math.round(r.top),w:Math.round(r.width),h:Math.round(r.height)}}
function persistOpen(){state.open=[...WINS.keys()];save()}
function openWin(id,o){
  let rec=WINS.get(id);
  if(rec){rec.el.classList.remove('min');focusWin(id,true);refreshFeeds();return rec}
  const el=document.createElement('section');
  el.className='win'+(o.panel?' panel':'');el.dataset.id=id;el.tabIndex=-1;el.setAttribute('role','dialog');el.setAttribute('aria-label',o.title);
  el.innerHTML=`<div class="titlebar"><h2>${esc(o.title)}</h2>${o.keyHint?`<span class="wk">${esc(o.keyHint)}</span>`:''}<button class="wbtn wmin" aria-label="Minimize" title="Minimize (native ⇧⌘M)">–</button><button class="wbtn wclose" aria-label="Close" title="Close">×</button></div><div class="wbody"></div><div class="resize" aria-hidden="true"></div>`;
  document.body.append(el);
  setFrame(el,o.frame||state.frames[id]||cascade(o.w||760,o.h||560));
  rec={id,el,title:o.title,panel:!!o.panel,onClose:o.onClose,stId:o.stId,tab:o.tab};
  WINS.set(id,rec);
  const body=$('.wbody',el);
  rec.render=()=>o.render(body,rec); rec.render();
  // drag
  const tb=$('.titlebar',el);
  tb.addEventListener('pointerdown',e=>{
    if(e.target.closest('button')||isPhone())return; e.preventDefault(); focusWin(id);
    const r=el.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top; tb.setPointerCapture(e.pointerId);
    const mv=ev=>{el.style.left=Math.min(innerWidth-100,Math.max(100-r.width,ev.clientX-ox))+'px';el.style.top=Math.min(innerHeight-40,Math.max(48,ev.clientY-oy))+'px'};
    const up=()=>{tb.removeEventListener('pointermove',mv);tb.removeEventListener('pointerup',up);state.frames[id]=frameOf(el);save()};
    tb.addEventListener('pointermove',mv);tb.addEventListener('pointerup',up);
  });
  tb.addEventListener('dblclick',e=>{if(!e.target.closest('button'))minimizeWin(id)});
  const rz=$('.resize',el);
  rz.addEventListener('pointerdown',e=>{
    e.preventDefault();const r=el.getBoundingClientRect();rz.setPointerCapture(e.pointerId);
    const mv=ev=>{el.style.width=Math.max(320,ev.clientX-r.left)+'px';el.style.height=Math.max(220,ev.clientY-r.top)+'px'};
    const up=()=>{rz.removeEventListener('pointermove',mv);rz.removeEventListener('pointerup',up);state.frames[id]=frameOf(el);save()};
    rz.addEventListener('pointermove',mv);rz.addEventListener('pointerup',up);
  });
  el.addEventListener('pointerdown',()=>focusWin(id),true);
  el.addEventListener('focusin',()=>{if(!el.classList.contains('focused'))focusWin(id)});
  $('.wclose',el).addEventListener('click',()=>closeWin(id));
  $('.wmin',el).addEventListener('click',()=>minimizeWin(id));
  focusWin(id,true); persistOpen(); refreshFeeds();
  return rec;
}
function focusWin(id,moveFocus){
  const r=WINS.get(id); if(!r)return;
  r.el.classList.remove('min');
  r.el.style.zIndex=(r.panel?1000:0)+(++Z);
  WINS.forEach(o=>o.el.classList.toggle('focused',o===r));
  focusHist=focusHist.filter(x=>x!==id);focusHist.push(id);
  if(r.stId) state.lastSt=r.stId;
  if(moveFocus&&!r.el.contains(document.activeElement)){const a=r.el.querySelector('[data-autofocus]');(a||r.el).focus({preventScroll:true})}
}
function closeWin(id){
  const r=WINS.get(id); if(!r)return;
  if(r.beforeClose&&r.beforeClose()===false)return;
  r.el.remove(); WINS.delete(id); focusHist=focusHist.filter(x=>x!==id);
  persistOpen(); r.onClose&&r.onClose(); refreshFeeds();
  const top=focusHist[focusHist.length-1]; top?focusWin(top,true):($('.tool')||document.body).focus&&($('.tool')||document.body).focus({preventScroll:true});
}
function minimizeWin(id){const r=WINS.get(id);if(!r)return;r.el.classList.add('min');r.el.classList.remove('focused');refreshFeeds()}
function showDesk(){WINS.forEach(r=>{r.el.classList.add('min');r.el.classList.remove('focused')});refreshFeeds();const b=$('.book')||$('.tool');b&&b.focus();toast('Desk to front. Minimized windows are in the drawer.',{ms:2200})}
function visibleWins(){return focusHist.filter(id=>WINS.has(id)&&!WINS.get(id).el.classList.contains('min'))}
function prevWin(){const v=focusHist.filter(id=>WINS.has(id));if(v.length<2){toast('No previous window',{ms:1500});return}focusWin(v[v.length-2],true)}
function cycleWin(d){const ids=[...WINS.keys()];if(!ids.length)return;const cur=focusHist[focusHist.length-1];let i=ids.indexOf(cur);i=(i+d+ids.length)%ids.length;focusWin(ids[i],true);refreshFeeds()}

function homo(w,h,q){ // rect(0,0,w,h) -> quad TL,TR,BR,BL ; returns CSS matrix3d
  const src=[[0,0],[w,0],[w,h],[0,h]],A=[],B=[];
  for(let i=0;i<4;i++){const [x,y]=src[i],[u,v]=q[i];A.push([x,y,1,0,0,0,-u*x,-u*y]);B.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);B.push(v);}
  const n=8;for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;[A[c],A[p]]=[A[p],A[c]];[B[c],B[p]]=[B[p],B[c]];
    for(let r=0;r<n;r++){if(r===c)continue;const f=A[r][c]/A[c][c];for(let k=c;k<n;k++)A[r][k]-=f*A[c][k];B[r]-=f*B[c];}}
  const [a,b,c,d,e,f,g,hh]=B.map((v,i)=>v/A[i][i]);
  return `matrix3d(${[a,d,0,g,b,e,0,hh,0,0,1,0,c,f,0,1].map(v=>+v.toFixed(8)).join(',')})`;
}

  SURVEY=`<svg viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sample survey illustration (not real geography)">

   <g transform="translate(905 600)"><circle r="44" fill="#f6edd4" stroke="#7a5a2a"/><path d="M0 -40 L8 0 L0 40 L-8 0Z" fill="#7a3a22"/><path d="M-40 0 L0 6 L40 0 L0 -6Z" fill="#9a7a4a"/><text y="-48" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#4a3a20">N</text></g>
   <g transform="translate(40 40)"><rect width="330" height="58" fill="#f6edd4" stroke="#7a5a2a" stroke-width="1.5"/><text x="14" y="25" font-family="Georgia,serif" font-size="18" fill="#3a2a14">SAMPLE SURVEY</text><text x="14" y="45" font-family="Georgia,serif" font-size="12" fill="#5a4a2a">Illustration only · not real geography · not to scale</text></g>
   <rect x="6" y="6" width="988" height="688" fill="none" stroke="#7a5a2a" stroke-width="3"/><rect x="14" y="14" width="972" height="672" fill="none" stroke="#7a5a2a" stroke-width="1"/></svg>`;
  return SURVEY;
}
function renderMap(body){
  body.classList.add('flush');
  body.innerHTML=`<div class="maptool"><div class="mapbar"><b>Sample survey</b><span class="sample">illustration · not real land</span><span class="grow"></span>

/* ---------- Journal ---------- */
function crumb(target){
  if(!target)return 'Journal inbox';
  const st=stById(target.stewardshipId); if(!st)return '?';
  const tid=target.placeId||target.personId||target.recordId, t=tid&&findTarget(st.id,tid);
  return (t?t.path:[st.name]).map(esc).join('<span class="sep">›</span>');
}
const crumbText=t=>crumb(t).replace(/<span class="sep">›<\/span>/g,' › ');
function suggest(text){
  const t=' '+text.toLowerCase()+' ', hits=[];
  stewardships().forEach(st=>targetsOf(st).forEach(tg=>{
    const re=new RegExp('\\b'+tg.name.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b');
    if(re.test(t)) hits.push({st,tg});
  }));
  hits.sort((a,b)=>b.tg.depth-a.tg.depth||(a.tg.kind==='place'?-1:1));
  const out=[],seen=new Set();
  for(const h of hits){if(out.length>=2)break;const k=h.tg.id;if(seen.has(k))continue;seen.add(k);
    out.push({stId:h.st.id,tid:h.tg.id,level:h.tg.kind,reason:`mentions “${h.tg.name}”`,path:h.tg.path});}
  let stLevel=hits[0]?hits[0].st:stewardships().find(s=>t.includes(s.name.toLowerCase()))||stById(state.lastSt)||stById(state.pins[0])||stewardships()[0];
  const why=hits[0]?'Stewardship level':(t.includes(stLevel.name.toLowerCase())?`mentions “${stLevel.name}”`:'most recently focused Stewardship');
  out.push({stId:stLevel.id,tid:null,level:'stewardship',reason:why,path:[stLevel.name]});
  return out.slice(0,3);
}
function tgKey(t){return t.kind==='place'?'placeId':t.kind==='person'?'personId':'recordId'}
function renderJournal(body,rec){
  rec.view=rec.view||'inbox'; rec.sel=rec.sel||0;

    <form class="jcap"><label class="sr" for="jtext">New Journal entry</label><textarea id="jtext" class="field" rows="3" data-autofocus placeholder="Capture a note, call, idea or task… Mention a place, person or record (try “Garage”, “Bed 2”, “Truck”, “Area 1”) to see the most specific suggestion."></textarea>
    <div class="row" style="margin-top:6px"><select class="field jkind" aria-label="Kind"><option value="note">Note</option><option value="call">Call</option><option value="idea">Idea</option><option value="task">Task</option></select>
    <button class="btn primary" type="submit">Save to inbox</button><span class="muted" style="font-size:12px">Saved as unfiled. Filing always asks you; nothing files itself.</span></div></form>
    <div class="row"><div class="segs" role="group" aria-label="View"><button data-v="inbox">Inbox</button><button data-v="filed">Filed</button><button data-v="archived">Archived</button></div><span class="grow"></span><span class="muted" style="font-size:12px">↑/↓ move · ⏎ file · Delete archive</span></div>
    <div class="jlist" tabindex="0" aria-label="Entries"></div></div>`;
  const ta=$('#jtext',body);

  rec.dirty=()=>!!ta.value.trim();
  $('.jcap',body).addEventListener('submit',e=>{e.preventDefault();const v=ta.value.trim();if(!v)return;const en=addEntry(v,$('.jkind',body).value);ta.value='';rec.view='inbox';rec.sel=0;drawList();toast('Saved to inbox (unfiled).',{action:'File…',onAction:()=>openFiling({entryId:en.id}),ms:7000})});
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();$('.jcap',body).requestSubmit()}});
  $$('.segs button',body).forEach(b=>b.addEventListener('click',()=>{rec.view=b.dataset.v;rec.sel=0;drawList()}));
  const list=$('.jlist',body);
  function items(){return state.journal.filter(e=>rec.view==='inbox'?e.status==='unfiled':e.status===rec.view)}
  function drawList(){
    $$('.segs button',body).forEach(b=>{b.setAttribute('aria-pressed',b.dataset.v===rec.view);const n=state.journal.filter(e=>b.dataset.v==='inbox'?e.status==='unfiled':e.status===b.dataset.v).length;b.textContent=b.dataset.v[0].toUpperCase()+b.dataset.v.slice(1)+` (${n})`});

    list.innerHTML=its.length?its.map((e,i)=>{

      return `<div class="entry ${i===rec.sel?'sel':''}" data-id="${e.id}"><div class="meta"><span class="kind">${e.kind}</span><span>${ago(e.createdAt)} ago</span>${e.status==='filed'?`<span>→ ${crumb(e.target)}</span>`:''}</div>
      <div>${esc(e.text)}</div>
      ${e.status==='unfiled'?`<div class="row" style="margin-top:5px">${sg.map((s,k)=>`<button class="chip" data-sg="${k}" title="${esc(s.reason)}"><span class="lvl">${s.level}</span>${s.path.map(esc).join(' › ')}</button>`).join('')}<span class="grow"></span><button class="btn small" data-act="file">File…</button><button class="btn small" data-act="archive">Archive</button></div>`
      :e.status==='filed'?`<div class="row" style="margin-top:5px"><button class="btn small" data-act="refile">Re-file…</button><button class="btn small" data-act="unfile">Move to unfiled</button></div>`
      :`<div class="row" style="margin-top:5px"><button class="btn small" data-act="unfile">Restore to inbox</button></div>`}</div>`}).join('')
      :`<p class="muted">${rec.view==='inbox'?'Inbox clear. Nothing to file.':'Nothing here yet.'}</p>`;
  }
  list.addEventListener('click',e=>{
    const row=e.target.closest('.entry'); if(!row)return; const en=state.journal.find(x=>x.id===row.dataset.id);

    const chip=e.target.closest('[data-sg]'); if(chip){const s=suggest(en.text)[+chip.dataset.sg];openFiling({entryId:en.id,stId:s.stId,tid:s.tid});return}
    const a=e.target.closest('[data-act]'); if(!a){drawList();return}
    if(a.dataset.act==='file'||a.dataset.act==='refile')openFiling({entryId:en.id});
    if(a.dataset.act==='archive'){if(confirm('Archive this entry? (It is not deleted.)')){en.status='archived';refreshFeeds()}}
    if(a.dataset.act==='unfile'){const prev={status:en.status,target:en.target};en.status='unfiled';delete en.target;refreshFeeds();toast('Moved back to unfiled.',{action:'Undo',onAction:()=>{Object.assign(en,prev);refreshFeeds()},ms:10000})}
  });
  list.addEventListener('keydown',e=>{
    const its=items(); if(!its.length)return;
    if(e.key==='ArrowDown'){rec.sel=Math.min(its.length-1,rec.sel+1);drawList();e.preventDefault()}
    else if(e.key==='ArrowUp'){rec.sel=Math.max(0,rec.sel-1);drawList();e.preventDefault()}
    else if(e.key==='Enter'){const en=its[rec.sel];if(en&&en.status!=='archived'){const s=en.status==='unfiled'?suggest(en.text)[0]:null;openFiling({entryId:en.id,stId:s&&s.stId,tid:s&&s.tid})}e.preventDefault()}
    else if((e.key==='Delete'||e.key==='Backspace')&&its[rec.sel]&&its[rec.sel].status==='unfiled'){e.preventDefault();if(confirm('Archive this entry? (It is not deleted.)')){its[rec.sel].status='archived';refreshFeeds()}}
  });
  rec.refresh=drawList; drawList();
}

/* ---------- Filing sheet (Journal + Notepad share it; always user-confirmed) ---------- */
function openFiling({entryId,noteId,stId,tid}){
  const en=entryId&&state.journal.find(e=>e.id===entryId), note=noteId&&state.notes.find(n=>n.id===noteId);
  const text=en?en.text:note?note.text:''; const sg=suggest(text);
  const cur={stId:stId||(en&&en.target&&en.target.stewardshipId)||sg[0].stId,tid:tid!==undefined?tid:(en&&en.target?(en.target.placeId||en.target.personId||en.target.recordId||null):sg[0].tid),inbox:false};
  const sheet=openOverlay('file',`<h3>${note?'File note':'File Journal entry'}</h3>
    <blockquote style="margin:0 0 10px;padding:6px 10px;border-left:3px solid var(--accent);background:var(--surface2);border-radius:4px">${esc(text)||'<i>(empty)</i>'}</blockquote>
    <div class="muted" style="font-size:12px;margin-bottom:4px">Suggestions, most specific first (the Stewardship level is always last):</div>
    <div class="row sgs"></div>
    <div style="margin:12px 0 4px" class="muted">File to</div><div class="crumbs" aria-live="polite"></div>
    <div class="row" style="margin-top:8px"><button class="btn widen" title="Widen one level (←)">← Widen</button>
      <label class="row" style="gap:4px">Stewardship <select class="field fst"></select></label>
      <label class="row" style="gap:4px">Narrow to <select class="field fnarrow"></select></label></div>
    <div class="row end" style="margin-top:14px"><span class="muted" style="font-size:12px;margin-right:auto">Never files automatically · Undo for 10 s</span><button class="btn fcancel">Cancel</button><button class="btn primary fok">File here ⏎</button></div>`,
   {onKey:e=>{
     const inSel=e.target.tagName==='SELECT';
     if(e.key==='ArrowLeft'&&!inSel){e.preventDefault();widen();return true}
     if(e.key==='Enter'&&!e.target.closest('button')){e.preventDefault();confirmFile();return true}
   }});
  const fst=$('.fst',sheet),fn=$('.fnarrow',sheet);
  fst.innerHTML=(note?`<option value="__inbox">Journal inbox (file later)</option>`:'')+stewardships().map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
  $('.sgs',sheet).innerHTML=sg.map((s,k)=>`<button class="chip" data-k="${k}" title="${esc(s.reason)}"><span class="lvl">${s.level}</span>${s.path.map(esc).join(' › ')}</button>`).join('');
  function draw(){
    fst.value=cur.inbox?'__inbox':cur.stId; fn.disabled=cur.inbox;
    const st=stById(cur.stId), ts=st?targetsOf(st):[];
    fn.innerHTML=`<option value="">(${esc(st?st.name:'')} · Stewardship level)</option>`+ts.map(t=>`<option value="${t.id}">${'  '.repeat(t.depth-1)}${esc(t.path.slice(1).join(' › '))} · ${t.kind}</option>`).join('');
    fn.value=cur.tid||'';
    $('.crumbs',sheet).innerHTML=cur.inbox?'Journal inbox (unfiled)':crumb({stewardshipId:cur.stId,...(cur.tid?{[tgKey(findTarget(cur.stId,cur.tid))]:cur.tid}:{})});
    $$('.sgs .chip',sheet).forEach(c=>{const s=sg[+c.dataset.k];c.classList.toggle('on',!cur.inbox&&s.stId===cur.stId&&(s.tid||null)===(cur.tid||null))});
    $('.widen',sheet).disabled=cur.inbox||!cur.tid;
  }
  function widen(){if(cur.inbox||!cur.tid)return;const t=findTarget(cur.stId,cur.tid);cur.tid=t&&t.parent||null;draw()}
  function confirmFile(){
    closeOverlay();
    const t=cur.tid&&findTarget(cur.stId,cur.tid);
    const target=cur.inbox?null:{stewardshipId:cur.stId,...(t?{[tgKey(t)]:t.id}:{})};
    if(en){
      const prev=JSON.parse(JSON.stringify(en));
      Object.assign(en,{status:'filed',target,filedAt:Date.now(),filedBy:'you'});
      refreshFeeds(); toast(`Filed → ${crumbText(target)}`,{action:'Undo',onAction:()=>{Object.keys(en).forEach(k=>delete en[k]);Object.assign(en,prev);refreshFeeds()},ms:10000});
    } else if(note){
      const created=addEntry(note.text,'note',target?{status:'filed',target,filedAt:Date.now(),filedBy:'you'}:{});
      const prev={...note}; note.status='filed'; note.filedAs={journalEntryId:created.id,target};
      refreshFeeds(); toast(target?`Note filed → ${crumbText(target)}`:'Note moved to Journal inbox',{action:'Undo',onAction:()=>{state.journal=state.journal.filter(x=>x.id!==created.id);Object.keys(note).forEach(k=>delete note[k]);Object.assign(note,prev);refreshFeeds()},ms:10000});
    }
    if(state.lastSt!==cur.stId&&!cur.inbox) state.lastSt=cur.stId;
  }
  $('.sgs',sheet).addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;const s=sg[+c.dataset.k];cur.inbox=false;cur.stId=s.stId;cur.tid=s.tid;draw()});

  fn.addEventListener('change',()=>{cur.tid=fn.value||null;draw()});
  $('.widen',sheet).addEventListener('click',widen);
  $('.fcancel',sheet).addEventListener('click',closeOverlay);
  $('.fok',sheet).addEventListener('click',confirmFile);
  draw(); $('.fok',sheet).focus();
}

/* ---------- Notepad (notes never expire; file / delete-with-undo / keep) ---------- */
function openNotepad(newNote){
  const existed=WINS.has('notepad');
  const rec=openWin('notepad',{title:'Notepad',keyHint:`${LEAD} N`,w:TOOL.notepad.w,h:TOOL.notepad.h,panel:true,render:renderNotepad,onClose:()=>{state.notes=state.notes.filter(n=>n.text.trim()||n.status!=='open');save();setTimeout(()=>showReview(false),60)}});

    if(newNote&&!blank){blank={id:uid('n'),text:'',createdAt:Date.now(),updatedAt:Date.now(),status:'open'};state.notes.unshift(blank)}
    rec.cur=newNote?blank.id:(rec.cur||(openNotes()[0]||{}).id); rec.trash=false; rec.render();
  }
  setTimeout(()=>{const ta=$('.win[data-id=notepad] textarea');ta&&ta.focus()},0);
}

function openSetups(){
  const cur=themeOf(state.theme);
  const sheet=openOverlay('Desk setups',`<h3>Desk setups</h3><p class="muted" style="margin-top:0;font-size:13px">Press <kbd>1</kbd>–<kbd>9</kbd> to apply · <kbd>Shift</kbd>+<kbd>1</kbd>–<kbd>9</kbd> to save the current windows, frames, placements and theme to that slot.</p>
   <ul class="setups" style="list-style:none;padding:0;margin:0"></ul>
   <h3 style="margin-top:14px;font-size:15px">Theme <span class="muted" style="font-size:12px;font-weight:400">· all 16 concept styles + Hearth · current: ${cur.name}</span></h3><div class="themes"></div>
   <h3 style="margin-top:14px;font-size:15px">Prototype controls</h3>
   <div class="row"><label class="row" style="gap:4px">Sample shelf size <select class="field ssz">${[1,5,12,20,40].map(n=>`<option ${n===state.shelfSize?'selected':''}>${n}</option>`).join('')}</select></label>
   <label class="row" style="gap:4px"><input type="checkbox" class="srest" ${state.restore?'checked':''}> Restore windows on reload</label>
   <span class="grow"></span><button class="btn small sreset">Reset sample data</button></div>`,{cls:'wide',onKey:e=>{
     const m=/^Digit([1-9])$/.exec(e.code);if(!m||e.target.tagName==='SELECT'||e.metaKey||e.ctrlKey||e.altKey)return;
     e.preventDefault();const n=+m[1];if(e.shiftKey)saveSetup(n);else{closeOverlay();applySetup(n)}return true}});
  const drawList=()=>{$('.setups',sheet).innerHTML=Array.from({length:9},(_,i)=>{const n=i+1,s=state.setups[n];return `<li><kbd>${n}</kbd><b>${s?esc(s.name):'<span class="muted">Empty slot</span>'}</b><span class="muted" style="font-size:12px">${s?(s.open.length?s.open.map(id=>id.startsWith('st:')?(stById(id.slice(3).split('#')[0])||{}).name:TOOL[id]&&TOOL[id].name).join(', '):'no windows'):''}</span><button class="btn small" data-apply="${n}" ${s?'':'disabled'}>Apply</button><button class="btn small" data-save="${n}">Save here</button></li>`}).join('')};
  $('.themes',sheet).innerHTML=THEMES.map(t=>{const o=themeOf(t.id);return `<button data-theme="${t.id}" aria-pressed="${t.id===state.theme}"><div class="sw"><i style="background:${o.bgSolid}"></i><i style="background:${o.surface}"></i><i style="background:${o.accent}"></i><i style="background:${o.metal||o.edge}"></i></div><b>${t.name}</b> <span class="muted" style="font-size:11px">${t.scene?'· painted':'· basic'}</span><br><span class="muted">${t.concept} · ${t.family}</span></button>`}).join('');
  sheet.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.apply){closeOverlay();applySetup(+b.dataset.apply)}
    if(b.dataset.save){saveSetup(+b.dataset.save);drawList()}
    if(b.dataset.theme){applyTheme(b.dataset.theme);$$('.themes button',sheet).forEach(x=>x.setAttribute('aria-pressed',x===b))}
    if(b.classList.contains('sreset')&&confirm('Reset all sample data, pins, notes and layout in this browser?')){localStorage.removeItem(LS);location.reload()}});
  $('.ssz',sheet).addEventListener('change',e=>{state.shelfSize=+e.target.value;state.pins=state.pins.filter(id=>stById(id)&&stewardships().some(s=>s.id===id));save();renderDesk()});
  $('.srest',sheet).addEventListener('change',e=>{state.restore=e.target.checked;save()});
  drawList(); const f=$('[data-apply]:not([disabled])',sheet); (f||sheet).focus&&(f||$('button',sheet)).focus();
}
function tileFrames(ids){
  const vw=innerWidth,vh=innerHeight,n=ids.length,top=60,gap=12,h=vh-top-80;
  const w=Math.floor((vw-gap*(n+1))/Math.max(1,n));
  return Object.fromEntries(ids.map((id,i)=>[id,{x:gap+i*(w+gap),y:top,w,h}]));
}
function applySetup(n){
  const s=state.setups[n]; if(!s){toast(`Setup slot ${n} is empty. Shift+${n} saves the current desk there.`);return}
  const dirty=[...WINS.values()].filter(r=>!s.open.includes(r.id)&&r.dirty&&r.dirty());
  if(dirty.length&&!confirm('A window you are closing has unsaved text. Close it anyway?')){toast('Setup not applied. Your text is safe.');return}
  [...WINS.keys()].filter(id=>!s.open.includes(id)).forEach(id=>{const r=WINS.get(id);if(r.dirty&&r.dirty())return;r.beforeClose=null;closeWin(id)});
  if(s.theme&&s.theme!==state.theme)applyTheme(s.theme,{silent:true});
  if(s.placements)state.placements=Object.assign({},state.placements,s.placements);
  const frames=s.frames||tileFrames(s.open);
  s.open.forEach(id=>{if(frames[id])state.frames[id]=frames[id];const ex=WINS.get(id);if(ex){setFrame(ex.el,frames[id]||frameOf(ex.el));ex.el.classList.remove('min')}else openById(id)});
  if(s.focus&&WINS.has(s.focus))focusWin(s.focus,true);
  state.setupName=s.name; renderDesk(); refreshFeeds(); toast(`Desk setup: ${s.name}`,{ms:2000});
}
function saveSetup(n){
  const old=state.setups[n];
  const name=(old&&old.name&&!['Morning review','Capture','Plain desk'].includes(old.name))?old.name:(prompt(`Name for setup ${n}:`,old?old.name:`Setup ${n}`)||`Setup ${n}`);
  const open=[...WINS.keys()].filter(id=>!WINS.get(id).el.classList.contains('min'));
  state.setups[n]={name,open,frames:Object.fromEntries(open.map(id=>[id,frameOf(WINS.get(id).el)])),theme:state.theme,placements:{...state.placements},focus:focusHist[focusHist.length-1]||null};
  state.setupName=name; save(); refreshFeeds(); toast(`Saved setup ${n}: ${name}`,{ms:2200});
}
function openKeys(){
  const L=`<kbd>${LEAD}</kbd>`;
  const rows=[['Stewardship picker','L','L','⌘L'],['Pinned Stewardship 1–9','1–9','1–9','⌘1–9'],['Desk to front','0','0','⌘0'],['Compass','I',`I`,'⌘I (⇧⌘I in text)'],['Map and surveys','M','M','⌘M'],['Journal','J','J','⌘J'],['Quick capture','Space','—','⌥⌘J'],['Notepad (new note)','N','N','⌘N'],['Calendar','K','K','⌘K (⇧⌘K in text)'],['Boards','B','B','⌘B (⇧⌘B in text)'],['Desk setups (then 1–9 apply, ⇧1–9 save)','D','D','⌘D'],['Window list','W','—','Window menu'],['Previous window',';','—','⌘`'],['Cycle windows','[ / ]','—','⌘` / ⇧⌘`'],['Stewardship tab 1–9 / All tabs','T then 1–9 / T 0','—','⌥⌘1–9 / ⌥⌘0'],['Keyboard shortcuts','?','?','⇧⌘?']];
  openOverlay('Keyboard shortcuts',`<h3>Keyboard shortcuts</h3>
   <p style="margin-top:0;font-size:13px">In this web prototype, press the leader ${L} (or <kbd>Ctrl;</kbd>), let go, then a key. A hint pops up after a moment. On the Desk surface (not typing in a field) the plain letter also works.${isMac?' <kbd>⌘J</kbd>, <kbd>⌘K</kbd>, <kbd>⌘B</kbd>, <kbd>⌘I</kbd> and <kbd>⌥⌘J</kbd> work directly where the browser allows.':''}</p>
   <table class="keys" style="width:100%;border-collapse:collapse"><tr><th>Action</th><th>Web: ${esc(LEAD)} then</th><th>Desk surface</th><th>Native Mac app (spec)</th></tr>
   ${rows.map(r=>`<tr><td>${r[0]}</td><td><kbd>${r[1]}</kbd></td><td>${r[2]==='—'?'—':`<kbd>${r[2]}</kbd>`}</td><td><kbd>${r[3]}</kbd></td></tr>`).join('')}
   <tr><td>Notepad: File… / Delete</td><td colspan="2"><kbd>${MOD}⏎</kbd> / <kbd>${MOD}⌫</kbd> in the note</td><td><kbd>⌘⏎</kbd> / <kbd>⌘⌫</kbd></td></tr>
   <tr><td>Journal list</td><td colspan="3">↑/↓ move · ⏎ file (confirm sheet: ← widen, choose to narrow, ⏎ confirm) · Delete archive</td></tr></table>
   <p class="muted" style="font-size:12px">Why the leader: browsers take ⌘N, ⌘M, ⌘L, ⌘D, ⌘0 and ⌘1–9 before a page can. The native app uses plain ⌘+letter (Minimize moves to ⇧⌘M, New Window to ⇧⌘N). In text, ⌘B/I/K/U keep formatting and the Desk keys use ⇧⌘. Keys stop working while focus is inside the embedded Calendar or Boards; click a title bar or the Desk to get them back.</p>
   <div class="row end"><button class="btn primary" onclick="this.closest('.ovl-back').click()">Done</button></div>`,{cls:'wide'});
  $('.ovl-back .btn.primary').onclick=closeOverlay; $('.ovl-back .btn.primary').focus();
}
function openWinList(){
  const ids=focusHist.slice().reverse().filter(id=>WINS.has(id)); let sel=0;
  const sheet=openOverlay('Windows',`<h3>Windows</h3><ul class="plist"></ul>`,{onKey:e=>{
    if(e.key==='ArrowDown'){sel=Math.min(ids.length-1,sel+1);draw();e.preventDefault();return true}
    if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);draw();e.preventDefault();return true}
    if(e.key==='Enter'&&ids[sel]){e.preventDefault();closeOverlay();focusWin(ids[sel],true);refreshFeeds();return true}}});
  const draw=()=>{$('.plist',sheet).innerHTML=ids.map((id,i)=>`<li class="${i===sel?'sel':''}" data-id="${esc(id)}"><span class="nm">${esc(WINS.get(id).title)}</span><span class="ago">${WINS.get(id).el.classList.contains('min')?'minimized':''}</span></li>`).join('')||'<li class="muted">No windows open. The Desk is all there is.</li>'};
  sheet.addEventListener('click',e=>{const li=e.target.closest('li[data-id]');if(li){closeOverlay();focusWin(li.dataset.id,true);refreshFeeds()}});
  draw(); sheet.tabIndex=-1; sheet.focus();
}
function quickCapture(){
  const sheet=openOverlay('Quick capture',`<form class="row" style="flex-wrap:nowrap"><input class="field qci" placeholder="Quick capture → Journal inbox" aria-label="Quick capture"><button class="btn primary">Save</button></form>`,{cls:'qc'});
  const i=$('.qci',sheet);i.focus();
  $('form',sheet).addEventListener('submit',e=>{e.preventDefault();const v=i.value.trim();if(!v)return;const en=addEntry(v,'note');closeOverlay();toast('Captured to Journal inbox (unfiled).',{action:'File…',onAction:()=>openFiling({entryId:en.id}),ms:7000})});
}

/* ================= TOASTS ================= */
function toast(msg,{action,onAction,ms=3500}={}){
  const t=document.createElement('div');t.className='toast';t.innerHTML=`<span>${esc(msg)}</span>${action?`<button>${esc(action)}</button>`:''}`;
  $('#toasts').append(t);const kill=()=>t.remove();
  if(action)t.querySelector('button').onclick=()=>{kill();onAction&&onAction()};
  setTimeout(kill,ms);
}

/* ================= HOTKEYS: leader ⌘; / Ctrl; + desk-surface letters ================= */
let LDR=null;
const ACTIONS={l:openPicker,i:()=>openTool('compass'),m:()=>openTool('map'),j:()=>openTool('journal'),n:()=>openNotepad(true),k:()=>openTool('calendar'),b:()=>openTool('boards'),d:openSetups,'0':showDesk,'?':openKeys,' ':quickCapture,w:openWinList,';':prevWin,'[':()=>cycleWin(-1),']':()=>cycleWin(1)};
function openPinned(n){const id=state.pins[n-1];if(id&&stById(id))openStewardship(id);else toast(`No Stewardship pinned to ${n}. Pin one from the picker (L).`)}
function runKey(k){
  if(OV&&OV.name!=='file')closeOverlay();
  if(/^[1-9]$/.test(k))return openPinned(+k);
  const f=ACTIONS[k];f&&f();
}
function setHint(){const h=$('#hint');if(LDR){h.textContent=`${LEAD} ${LDR.sub?'T …':'…'}  (Esc cancels)`;h.classList.add('live')}else{h.innerHTML=`<span class="kbd">${esc(LEAD)}</span> then a key · <span class="kbd">L</span> Stewardships · <span class="kbd">?</span> keys`;h.classList.remove('live')}}
function startLeader(sub){
  stopLeader();
  LDR={sub:sub||null,hint:setTimeout(showWhichKey,400),to:setTimeout(()=>{stopLeader();toast('Leader timed out',{ms:1200})},2000)};
  const b=document.createElement('div');b.className='leaderbadge';b.id='ldrb';b.textContent=sub?`${LEAD} T …`:`${LEAD} …`;b.setAttribute('role','status');document.body.append(b);
  setHint();
}
function stopLeader(){if(!LDR)return;clearTimeout(LDR.hint);clearTimeout(LDR.to);LDR=null;$('#ldrb')&&$('#ldrb').remove();$('.whichkey')&&$('.whichkey').remove();setHint()}
function showWhichKey(){
  if(!LDR)return;const w=document.createElement('div');w.className='whichkey';
  const items=LDR.sub?[['1–9','tab 1–9'],['0','all tabs']]:[['L','Stewardships'],['1–9','pinned'],['0','Desk'],['I','Compass'],['M','Map'],['J','Journal'],['N','Notepad'],['K','Calendar'],['B','Boards'],['D','Setups'],['␣','Capture'],['W','Windows'],[';','Previous'],['[ ]','Cycle'],['T','Tab…'],['?','Keys']];
  w.innerHTML=`<h4>${LEAD} ${LDR.sub?'T':''} then…</h4>`+items.map(([k,l])=>`<span class="key">${k}</span><span>${l}</span>`).join('');document.body.append(w);
}
function isText(el){return !!el&&(el.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))&&!(el.type==='checkbox'||el.type==='radio')}
function handleKey(e){
  // Leader: ⌘; (Mac) or Ctrl; (alternate). Matches physical key.
  if((e.metaKey||e.ctrlKey)&&!e.altKey&&!e.shiftKey&&e.code==='Semicolon'){e.preventDefault();e.stopPropagation();startLeader();return}
  if(LDR){
    if(['Shift','Meta','Control','Alt','CapsLock'].includes(e.key))return;
    e.preventDefault();e.stopPropagation();
    const sub=LDR.sub; stopLeader();
    if(e.key==='Escape')return;
    if(sub==='T'){const m=/^Digit([0-9])$/.exec(e.code);if(m)gotoTab(+m[1]);return}
    if(e.code==='KeyT'){startLeader('T');return}
    const dm=/^Digit([0-9])$/.exec(e.code);
    if(dm&&!e.shiftKey){runKey(dm[1]);return}
    let k=e.key===' '?' ':e.key.toLowerCase();
    if(e.code&&/^Key[A-Z]$/.test(e.code)&&!/[a-z]/.test(k))k=e.code.slice(3).toLowerCase();
    if(ACTIONS[k])runKey(k); else toast(`${LEAD} ${e.key}: not a Desk key (cancelled)`,{ms:1400});
    return;
  }
  if(OV){
    if(e.key==='Escape'){e.preventDefault();closeOverlay();return}
    if(OV.onKey&&OV.onKey(e))return;
    return;
  }
  const inText=isText(e.target);
  // Native-style ⌘ keys that browsers usually let through (Mac). Text fields keep ⌘B/I/K formatting → ⇧⌘ alternates.
  if(e.metaKey&&!e.ctrlKey){
    if(e.altKey&&e.code==='KeyJ'){e.preventDefault();quickCapture();return}
    if(!e.altKey){
      const k=e.code.startsWith('Key')?e.code.slice(3).toLowerCase():'';
      if(k==='j'&&!e.shiftKey){e.preventDefault();runKey('j');return}
      if(['b','i','k'].includes(k)){
        if(inText&&e.shiftKey){e.preventDefault();runKey(k);return}
        if(!inText&&!e.shiftKey){e.preventDefault();runKey(k);return}
      }
    }
    return;
  }
  if(e.ctrlKey||e.altKey||inText)return;
  if(e.target.closest&&e.target.closest('.win')&&!['?'].includes(e.key)&&!e.target.classList.contains('win'))return; // plain keys = Desk surface only
  const k=e.key.toLowerCase();
  if('limjnkbd0123456789?'.includes(k)&&k.length===1){e.preventDefault();runKey(k)}
}
document.addEventListener('keydown',handleKey,true);
addEventListener('blur',()=>stopLeader());

/* ================= INIT ================= */
buildThemeSelect();
applyTheme(state.theme,{silent:true});
renderDesk(); wireDesk(); setHint();
const tick=()=>{$('#clock').textContent=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})};tick();setInterval(tick,15000);
if(state.restore&&state.open&&state.open.length){const ids=state.open.slice();state.open=[];ids.forEach(id=>{try{openById(id)}catch(e){console.warn(e)}})}
addEventListener('resize',()=>{WINS.forEach(r=>{if(!isPhone())setFrame(r.el,frameOf(r.el))})});
window.StewardDesk={state,openTool,openStewardship,applyTheme,runKey,THEMES,WINS};
})();
</script>
