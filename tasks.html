<!doctype html>
<html lang="en" data-theme="brass" data-family="object">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Steward Tasks · prototype (sample data)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%222%22 y=%222%22 width=%2212%22 height=%2212%22 rx=%223%22 fill=%22none%22 stroke=%22%23775021%22 stroke-width=%222%22/%3E%3Cpath d=%22M5 8l2 2 4-4%22 stroke=%22%23775021%22 stroke-width=%222%22 fill=%22none%22/%3E%3C/svg%3E">
<style>
@font-face{font-family:'EB Garamond';src:url(assets/fonts/ebgaramond.woff2) format('woff2');font-weight:400 800;font-display:swap}
@font-face{font-family:'EB Garamond';src:url(assets/fonts/ebgaramond-italic.woff2) format('woff2');font-style:italic;font-display:swap}
@font-face{font-family:'Caveat';src:url(assets/fonts/caveat.woff2) format('woff2');font-weight:400 700;font-display:swap}
@font-face{font-family:'Inter';src:url(assets/fonts/inter.woff2) format('woff2');font-weight:300 800;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url(assets/fonts/jetbrainsmono.woff2) format('woff2');font-weight:400 800;font-display:swap}
@font-face{font-family:'Rajdhani';src:url(assets/fonts/rajdhani-500.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Rajdhani';src:url(assets/fonts/rajdhani-600.woff2) format('woff2');font-weight:600 700;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 var(--f-body);color:var(--desk-ink);background:var(--bg);background-color:var(--bg-solid);overflow:hidden;-webkit-font-smoothing:antialiased}
html{--row-h:38px;--list-bg:var(--ov-bg);--list-ink:var(--ov-ink);--list-line:color-mix(in srgb,var(--ov-ink) 12%,transparent);--list-muted:color-mix(in srgb,var(--ov-ink) 58%,transparent);
  --chk:var(--accent);--h-font:var(--f-display);--rhythm:var(--accent2);--today:#d89a2b;--evening:#6a7fd0;--deadline:var(--alert)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{opacity:.7}
kbd{font:600 11px var(--f-mono);border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.9}
.app{display:grid;grid-template-columns:268px 1fr;height:100%;height:100dvh}
/* ---------- sidebar ---------- */
.side{display:flex;flex-direction:column;min-height:0;padding:14px 10px 10px;color:var(--desk-ink);background:var(--hdr-bg);border-right:1px solid var(--hdr-line);backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:9px;padding:0 6px 12px}
.brand .mark{width:30px;height:30px;border:1.5px solid currentColor;border-radius:calc(var(--radius)*.7);display:grid;place-items:center}
.brand b{font:600 18px/1.1 var(--h-font);display:block}
.brand small{font-size:10.5px;opacity:.7;letter-spacing:.04em}
.nav{overflow:auto;flex:1;min-height:0;padding-right:2px}
.nav button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:5px 8px;border-radius:calc(var(--radius)*.6);text-align:left;font-size:13.5px;color:inherit}
.nav button:hover{background:color-mix(in srgb,var(--desk-ink) 9%,transparent)}
.nav button[aria-current=page]{background:color-mix(in srgb,var(--desk-ink) 16%,transparent);font-weight:600}
.nav .ic{width:18px;height:18px;flex:0 0 auto;display:grid;place-items:center}
.nav .ic svg{width:17px;height:17px}
.nav .ct{margin-left:auto;font:600 11px var(--f-mono);opacity:.75}
.nav .ct.hot{background:var(--alert);color:#fff;border-radius:9px;padding:0 6px;opacity:1}
.nav .grp{margin-top:14px;padding:2px 8px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.nav .st{font-weight:600}
.nav .pj{padding-left:22px;font-size:13px}
.nav .pie{width:13px;height:13px;border-radius:50%;border:1.5px solid currentColor;background:conic-gradient(currentColor calc(var(--p)*1%),transparent 0);opacity:.85}
.side-foot{display:flex;gap:6px;align-items:center;padding-top:8px;border-top:1px solid var(--hdr-line);font-size:12px}
.side-foot select{flex:1;min-width:0;background:var(--surface);color:var(--ink);border:1px solid var(--hdr-line);border-radius:6px;padding:3px 4px;font-size:12px}
.iconbtn{width:28px;height:28px;border-radius:50%;border:1px solid var(--hdr-line);background:none;font-weight:700;display:grid;place-items:center;padding:0}
/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:14px 22px 16px}
.topbar{display:flex;align-items:center;gap:10px;color:var(--desk-ink);margin-bottom:10px;font-size:12px;flex-wrap:wrap}
.topbar .grow{flex:1}
.syncbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hdr-line);background:var(--hdr-bg);color:var(--hdr-ink);border-radius:999px;padding:4px 11px;font-size:12px}
.syncbtn svg{width:14px;height:14px}
.syncing .syncbtn svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pend{display:inline-flex;gap:5px;align-items:center;border-radius:999px;padding:3px 9px;background:var(--attention);color:#fff;font-weight:600;border:0}
.pend[hidden]{display:none}
.samplechip{font:600 9.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;border:1px dashed currentColor;border-radius:4px;padding:1px 5px;opacity:.75}
.offline .badge{font:700 9.5px var(--f-mono);letter-spacing:.08em;border:1.3px solid currentColor;border-radius:4px;padding:1px 4px;vertical-align:3px;opacity:.85}
.badge:empty{display:none}
#links .badge{background:none;color:inherit;margin-right:4px;cursor:pointer}
.conf{display:inline-flex;border-radius:999px;padding:3px 9px;background:var(--alert);color:#fff;font-weight:600;border:0}.conf[hidden]{display:none}
.tag.confirmed{border-color:var(--ok);color:var(--ok)}.tag.conflict{background:var(--alert);color:#fff;border-color:var(--alert)}
.tag.ut{border-color:var(--tc);color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,transparent)}
.tag.ut::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tc)}
.task .snip{font-size:12px;color:var(--list-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.task .mini{display:inline-flex;gap:5px;margin-left:8px;vertical-align:1px;color:var(--list-muted);font:600 10.5px var(--f-mono)}
.task .mini svg{width:12px;height:12px;vertical-align:-2px}
.task .mini .md{width:7px;height:7px;border-radius:50%;display:inline-block;align-self:center}
.compact .task{min-height:0;padding:5px 8px}
.tfilter{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.tfilter button{cursor:pointer}
.tfilter button[aria-pressed=true]{background:var(--tc);color:#fff}
.tagrow{display:grid;grid-template-columns:22px 1fr 110px 80px 90px;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--list-line);font-size:12.5px}
.tagrow input[type=text]{border:1px solid var(--list-line);background:transparent;border-radius:5px;padding:3px 6px;color:var(--list-ink);width:100%}
.tagrow input[type=color]{width:22px;height:22px;border:0;padding:0;background:none}
.tagrow.arch{opacity:.5}
.pick{max-height:46vh;overflow:auto;margin-top:8px}
.pick button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;padding:5px 6px;border-radius:6px;color:var(--list-ink);text-align:left}
.pick button.hi,.pick button:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.pick .box{width:15px;height:15px;border:1.5px solid var(--tc);border-radius:4px;display:grid;place-items:center;font-size:11px;color:#fff}
.pick button[aria-checked=true] .box{background:var(--tc)}
.pick small{margin-left:auto;color:var(--list-muted);font-size:11px}
.dot{background:var(--alert)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.sheet{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--list-bg);color:var(--list-ink);border-radius:var(--radius);border:var(--ov-border);box-shadow:var(--ov-shadow);backdrop-filter:var(--card-blur);position:relative;overflow:hidden;max-width:880px;width:100%;margin:0 auto}
.sheet-h{padding:22px 34px 8px;display:flex;align-items:flex-end;gap:12px}
.sheet-h h1{margin:0;font:600 28px/1.1 var(--h-font);display:flex;align-items:center;gap:10px}
.sheet-h h1 svg{width:26px;height:26px}
.sheet-h .sub{font-size:12.5px;color:var(--list-muted);margin-left:auto;text-align:right}
.sheet-h .act{margin-left:auto;display:flex;gap:6px}
.btn{border:1px solid var(--list-line);background:color-mix(in srgb,var(--list-ink) 5%,transparent);border-radius:calc(var(--radius)*.6);padding:5px 11px;font-size:12.5px;color:var(--list-ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:hover{border-color:var(--accent)}
.scroller{flex:1;overflow:auto;padding:4px 34px 70px;position:relative;overscroll-behavior:contain}
.ptr{height:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;font-size:12px;color:var(--list-muted);transition:height .18s}
.ptr.on{transition:none}
.ptr span{padding-bottom:8px;display:flex;gap:6px;align-items:center}
.ptr svg{width:15px;height:15px;transition:transform .15s}
.ptr.ready svg{transform:rotate(180deg)}
h2.sec{font:600 15px var(--h-font);margin:22px 0 4px;padding-bottom:5px;border-bottom:1px solid var(--list-line);display:flex;align-items:center;gap:8px}
h2.sec small{font:500 11.5px var(--f-body);color:var(--list-muted);margin-left:auto}
h2.sec.evening svg{color:var(--evening)}
h3.head{font:700 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:18px 0 2px;padding-bottom:3px;border-bottom:1px solid var(--list-line)}
.empty{padding:40px 0;text-align:center;color:var(--list-muted)}
.empty b{display:block;font:600 17px var(--h-font);color:var(--list-ink);margin-bottom:4px;opacity:.8}
/* task rows */
ul.tasks{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:flex-start;gap:10px;min-height:var(--row-h);padding:8px 8px;border-radius:calc(var(--radius)*.6);position:relative;cursor:default}
.task:hover{background:color-mix(in srgb,var(--list-ink) 4%,transparent)}
.task.sel{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.task .chk{flex:0 0 auto;width:18px;height:18px;margin-top:1px;border:1.6px solid color-mix(in srgb,var(--list-ink) 55%,transparent);border-radius:5px;background:transparent;padding:0;display:grid;place-items:center;color:var(--accent-ink)}
.task .chk:hover{border-color:var(--chk)}
.task.done .chk{background:var(--chk);border-color:var(--chk)}
.task.done .chk::after{content:"";width:9px;height:5px;border:2px solid currentColor;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.task.pendingDone .chk{border-style:dashed;border-color:var(--chk)}
.task.pendingDone .chk::after{content:"…";color:var(--chk);font-size:11px;line-height:1}
.task .body{flex:1;min-width:0}
.task .ttl{display:block;word-break:break-word}
.task.done .ttl{text-decoration:line-through;opacity:.55}
.task .meta{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:2px;font-size:11.5px;color:var(--list-muted);align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:0 7px;border:1px solid var(--list-line);font-size:11px;line-height:17px;white-space:nowrap}
.tag svg{width:11px;height:11px}
.tag.rhythm{border-color:var(--rhythm);color:var(--rhythm)}
.tag.doing{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag.today{color:var(--today);border-color:var(--today)}
.tag.dl{color:var(--deadline);border-color:var(--deadline)}
.tag.pending{border-style:dashed;color:var(--attention);border-color:var(--attention)}
.tag.soon{border-color:var(--accent)}
.task .when{font:600 11px var(--f-mono);color:var(--list-muted);white-space:nowrap;margin-top:2px}
.task .star{color:var(--today)}
.task .detail{margin-top:6px;font-size:12.5px;color:var(--list-muted)}
.task .detail .notes{white-space:pre-wrap;margin-bottom:6px}
.checklist{list-style:none;margin:4px 0 0;padding:0}
.checklist li{display:flex;gap:7px;align-items:center;font-size:12.5px;padding:1px 0}
.checklist li i{width:11px;height:11px;border:1.3px solid currentColor;border-radius:50%;display:inline-block}
.checklist li.d i{background:currentColor}.checklist li.d{text-decoration:line-through;opacity:.6}
.idline{font:10.5px var(--f-mono);opacity:.6;margin-top:6px}
/* project cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:6px}
.pcard{border:1px solid var(--list-line);border-radius:var(--radius);padding:11px 13px;background:color-mix(in srgb,var(--list-ink) 3%,transparent);text-align:left;color:var(--list-ink);display:flex;flex-direction:column;gap:6px}
.pcard:hover,.pcard.sel{border-color:var(--accent)}
.pcard b{font:600 15px var(--h-font)}
.pcard .bar{height:4px;border-radius:2px;background:var(--list-line);overflow:hidden}
.pcard .bar i{display:block;height:100%;background:var(--accent)}
.pcard small{color:var(--list-muted);font-size:11.5px}
/* quick entry */
.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-start;justify-content:center;padding-top:14vh;z-index:40}
.overlay[hidden]{display:none}
.qe{width:min(560px,94vw);background:var(--list-bg);color:var(--list-ink);border-radius:var(--radius);border:var(--ov-border);box-shadow:0 24px 60px rgba(0,0,0,.45);padding:16px 18px;backdrop-filter:var(--card-blur)}
.qe-bg{background:var(--surface)}
.qe input,.qe textarea{width:100%;border:0;background:transparent;outline:none;font-size:17px;color:var(--list-ink)}
.qe textarea{font-size:13px;min-height:44px;resize:vertical;color:var(--list-muted);margin-top:6px}
.qe .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:20px}
.qe .foot{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11.5px;color:var(--list-muted)}
.qe .foot .grow{flex:1}
.qe h4{margin:0 0 8px;font:600 13px var(--h-font);color:var(--list-muted)}
/* triage */
.triage{width:min(600px,94vw);background:var(--list-bg);color:var(--list-ink);border-radius:var(--radius);border:var(--ov-border);box-shadow:0 24px 60px rgba(0,0,0,.45);padding:18px 20px;backdrop-filter:var(--card-blur)}
.triage .prog{font:600 11px var(--f-mono);color:var(--list-muted);display:flex;justify-content:space-between}
.triage .card{margin:12px 0 14px;padding:16px;border:1px solid var(--list-line);border-radius:var(--radius);background:color-mix(in srgb,var(--list-ink) 3%,transparent)}
.triage .card > b{font:600 20px/1.25 var(--h-font);display:block}
.triage .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.triage .opts button{border:1px solid var(--list-line);background:none;border-radius:calc(var(--radius)*.7);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--list-ink);font-weight:600}
.triage .opts button:hover,.triage .opts button:focus-visible{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.triage .opts kbd{font-size:10.5px}
.triage .opts small{font-weight:400;font-size:11px;color:var(--list-muted)}
.triage .datepick{display:flex;gap:8px;align-items:center;margin-top:10px}
.triage .datepick[hidden]{display:none}
.triage .datepick input{border:1px solid var(--list-line);background:transparent;border-radius:6px;padding:5px 8px;color:var(--list-ink)}
.triage .log{margin-top:12px;font-size:12px;color:var(--list-muted);max-height:90px;overflow:auto}
/* help + settings */
.panel{width:min(640px,94vw);max-height:80vh;overflow:auto;background:var(--list-bg);color:var(--list-ink);border-radius:var(--radius);border:var(--ov-border);box-shadow:0 24px 60px rgba(0,0,0,.45);padding:18px 22px}
.panel h3{margin:0 0 10px;font:600 18px var(--h-font)}
.panel table{width:100%;border-collapse:collapse;font-size:13px}
.panel td{padding:4px 6px;border-bottom:1px solid var(--list-line)}
.panel td:first-child{white-space:nowrap;width:42%}
.panel label{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.panel .q{border-left:3px solid var(--accent);padding:4px 10px;margin:6px 0;font-size:12.5px}
/* toasts */
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;align-items:center;pointer-events:none}
.toast{background:var(--surface);color:var(--ink);border:1px solid var(--edge);border-radius:999px;padding:7px 15px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);pointer-events:auto}
/* bottom tabs (phone) */
.tabs{display:none}
.fab{display:none}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 0 0 auto;width:86vw;z-index:45;transform:translateX(100%);transition:transform .2s;box-shadow:-10px 0 30px rgba(0,0,0,.4);background:var(--bg);background-color:var(--bg-solid)}
  .side.open{transform:none}
  .main{padding:10px 8px calc(66px + env(safe-area-inset-bottom))}
  .topbar{margin:0 6px 8px;flex-wrap:nowrap}.topbar .samplechip{display:none}.syncbtn span{display:none}.syncbtn{padding:6px 9px}
  .sheet-h{padding:16px 16px 6px}.sheet-h h1{font-size:24px}
  .scroller{padding:0 12px 90px}
  .task{padding:10px 4px}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(var(--hdr-bg),var(--hdr-bg)),var(--bg-solid);border-top:1px solid var(--hdr-line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}
  .tabs button{flex:1;border:0;background:none;color:var(--desk-ink);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:5px 0;opacity:.7;position:relative}
  .tabs button[aria-current=page]{opacity:1;font-weight:700}
  .tabs svg{width:22px;height:22px}
  .tabs .b{position:absolute;top:1px;left:56%;background:var(--alert);color:#fff;border-radius:8px;font-size:9.5px;padding:0 4px}
  .fab{display:grid;position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.35);z-index:31;font-size:28px;line-height:1}
  .overlay{padding-top:8vh}
  .triage .opts{grid-template-columns:repeat(2,1fr)}
  .kbonly{display:none}
  #densBtn{display:none}
  .toasts{bottom:calc(140px + env(safe-area-inset-bottom))}
  .pgrid{grid-template-columns:1fr}
}
/* =============== THEMED LIST CHROME =============== */
/* Brass — leather-bound ledger page on the wood desk */
html[data-theme=brass]{--h-font:'EB Garamond',var(--f-display)}
html[data-theme=brass] .sheet{border-radius:6px;box-shadow:0 0 0 8px #5b3420,0 0 0 9px #d8b36d55,0 22px 40px rgba(0,0,0,.55);
  background:repeating-linear-gradient(180deg,transparent 0 37px,rgba(119,80,33,.13) 37px 38px),radial-gradient(ellipse at 50% 0%,#fbf1da,#f1e2c4 70%,#e7d0a4)}
html[data-theme=brass] .sheet::before{content:"";position:absolute;left:22px;top:0;bottom:0;width:1px;background:rgba(163,50,42,.35)}
html[data-theme=brass] .sheet-h h1{font-size:32px;font-weight:600;color:#3b2512}
html[data-theme=brass] .task .chk{border-color:#775021;border-radius:3px;box-shadow:inset 0 1px 2px rgba(0,0,0,.18)}
html[data-theme=brass] .task.done .chk{background:#775021}
html[data-theme=brass] .side .brand .mark{color:#d8b36d}
html[data-theme=brass] .nav .grp{color:#d8b36d;opacity:.9}
html[data-theme=brass] h2.sec{font-size:18px;border-bottom:1.5px double rgba(119,80,33,.5)}
html[data-theme=brass] h3.head{color:#a3322a;font-family:'EB Garamond',serif;font-size:13px;letter-spacing:.16em}
html[data-theme=brass] .main{margin:6px 0}
/* Night Studio — dark ember studio, glowing marks */
html[data-theme=night]{--h-font:'EB Garamond',var(--f-display);--list-line:rgba(255,173,152,.14);--today:#ffb35c;--evening:#ff9a85}
html[data-theme=night] .sheet{background:radial-gradient(ellipse 70% 40% at 85% 0%,rgba(182,98,80,.22),transparent 70%),linear-gradient(180deg,#1f0a08,#160605);border:1px solid #5a2419;box-shadow:0 0 0 1px #000,0 30px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,173,152,.08)}
html[data-theme=night] .sheet-h h1{font-style:italic;font-weight:500;font-size:32px;color:#ffad98;text-shadow:0 0 18px rgba(255,122,92,.35)}
html[data-theme=night] .task .chk{border-radius:50%;border-color:#b66250}
html[data-theme=night] .task.done .chk{background:#ff7a5c;border-color:#ff7a5c;box-shadow:0 0 10px rgba(255,122,92,.6)}
html[data-theme=night] .task.sel{background:rgba(182,98,80,.2);box-shadow:inset 2px 0 0 #ff7a5c}
html[data-theme=night] h3.head{color:#ff7a5c}
/* Field Journal — kraft notebook, handwritten headings, graph paper */
html[data-theme=field-journal]{--h-font:'Caveat','Marker Felt',cursive;--list-line:rgba(94,50,24,.18)}
html[data-theme=field-journal] .sheet{border-radius:3px 10px 10px 3px;
  background:linear-gradient(rgba(94,120,150,.10) 1px,transparent 1px) 0 0/18px 18px,linear-gradient(90deg,rgba(94,120,150,.10) 1px,transparent 1px) 0 0/18px 18px,linear-gradient(180deg,#fffaf0,#f6ecd6);
  box-shadow:-10px 0 0 -2px #5e3218,-11px 0 0 -1px #3f200e,0 18px 36px rgba(0,0,0,.45);border-left:14px solid #5e3218}
html[data-theme=field-journal] .sheet::after{content:"";position:absolute;right:26px;top:-6px;width:16px;height:70px;background:#a3322a;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);opacity:.9}
html[data-theme=field-journal] .sheet-h h1{font-size:42px;font-weight:700;color:#2e1f12;transform:rotate(-1deg)}
html[data-theme=field-journal] h2.sec{font-size:26px;font-weight:700;border-bottom:2px solid rgba(94,50,24,.35);border-radius:0 0 40% 10%/0 0 4px 2px}
html[data-theme=field-journal] h3.head{font-family:'Caveat',cursive;font-size:20px;text-transform:none;letter-spacing:0;color:#a3322a}
html[data-theme=field-journal] .task .ttl{font-size:14.5px}
html[data-theme=field-journal] .task .chk{border:2px solid #2e1f12;border-radius:3px 5px 2px 6px;transform:rotate(-2deg)}
html[data-theme=field-journal] .task.done .chk{background:none;color:#2e7d4a}
html[data-theme=field-journal] .task.done .chk::after{border-color:#2e7d4a;width:11px;height:6px;border-width:3px}
html[data-theme=field-journal] .tag{border-style:dashed}
html[data-theme=field-journal] .empty b{font-size:26px}
/* White Line — engineering drawing: hairlines, mono labels, square marks */
html[data-theme=white-line]{--h-font:'JetBrains Mono',var(--f-mono);--list-line:#dddddd;--today:#111;--rhythm:#2f6fd6}
html[data-theme=white-line] .sheet{border:1.5px solid #111;border-radius:0;box-shadow:6px 6px 0 #111}
html[data-theme=white-line] .sheet-h{border-bottom:1.5px solid #111;padding-bottom:14px}
html[data-theme=white-line] .sheet-h h1{font-size:22px;text-transform:uppercase;letter-spacing:.14em;font-weight:700}
html[data-theme=white-line] h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.14em;border-bottom:1.5px solid #111}
html[data-theme=white-line] h3.head{color:#111;font-family:'JetBrains Mono',monospace;font-size:11px}
html[data-theme=white-line] .task{border-radius:0;border-bottom:1px solid #eee}
html[data-theme=white-line] .task .chk{border-radius:0;border:1.5px solid #111}
html[data-theme=white-line] .task.done .chk{background:#111}
html[data-theme=white-line] .task.sel{background:#f3f3f1;box-shadow:inset 3px 0 0 #111}
html[data-theme=white-line] .tag{border-radius:0;font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase}
html[data-theme=white-line] .tag.doing{background:#111;color:#fff}
html[data-theme=white-line] .side{background:#fff}
html[data-theme=white-line] .nav button{border-radius:0;font-family:'JetBrains Mono',monospace;font-size:12px}
html[data-theme=white-line] .nav button[aria-current=page]{background:#111;color:#fff}
html[data-theme=white-line] .btn,html[data-theme=white-line] .pcard{border-radius:0;border-color:#111}
html[data-theme=white-line] .pcard .bar i{background:#111}
/* Glass Bridge — frosted glass over starfield, condensed HUD type */
html[data-theme=glass-bridge]{--h-font:'Rajdhani',var(--f-display);--list-line:rgba(79,209,255,.18);--today:#ffd36b;--rhythm:#7ef0c2;--evening:#b9a6ff}
html[data-theme=glass-bridge] body{font-family:'Inter',var(--f-body)}
html[data-theme=glass-bridge] .sheet{background:linear-gradient(180deg,rgba(20,52,84,.55),rgba(8,24,44,.5));border:1px solid rgba(79,209,255,.35);border-radius:16px;backdrop-filter:blur(14px);box-shadow:0 0 0 1px rgba(79,209,255,.08),0 30px 70px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}
html[data-theme=glass-bridge] .sheet-h h1{font-size:34px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#dff3ff;text-shadow:0 0 16px rgba(79,209,255,.45)}
html[data-theme=glass-bridge] h2.sec{font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:#4fd1ff}
html[data-theme=glass-bridge] .task .chk{border-radius:50%;border-color:#4fd1ff;box-shadow:0 0 6px rgba(79,209,255,.4)}
html[data-theme=glass-bridge] .task.done .chk{background:#4fd1ff;box-shadow:0 0 12px #4fd1ff}
html[data-theme=glass-bridge] .task.sel{background:rgba(79,209,255,.14);box-shadow:inset 0 0 0 1px rgba(79,209,255,.5)}
html[data-theme=glass-bridge] .side{background:rgba(6,18,34,.45)}
html[data-theme=glass-bridge] .nav button{font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:500;letter-spacing:.03em}
html[data-theme=glass-bridge] .nav button[aria-current=page]{background:rgba(79,209,255,.18);box-shadow:inset 0 0 0 1px rgba(79,209,255,.45)}
/* family fallbacks for the other 12 themes (token-driven) */
html[data-family=line]{--h-font:var(--f-display)}
html[data-family=line] .sheet{border-radius:0;box-shadow:none}
html[data-family=line] .task .chk{border-radius:0}
html[data-family=terminal] *{font-family:var(--f-mono)!important;border-radius:0!important}
html[data-family=terminal] .task .chk::after{content:"x";border:0;transform:none;width:auto;height:auto;font-size:12px}
html[data-family=instrument] .task .chk{border-radius:4px}
html[data-family=orbital] .task .chk{border-radius:50%}
</style>
</head>

/* ==========================================================================
   3-provider.js — the ONLY data boundary of the task surface.
   Same pattern as stewardos-desk/codex-packet/src/provider.js:
     SampleProvider — fictional data, a simulated Engine kept in localStorage.
     LiveProvider   — STUB for the StewardOS Engine. Every write is a PROPOSAL.
   The UI never writes Vault records. It queues proposals locally (TaskStore)
   and sends them on sync. Grep "INTEGRATION POINT:" for every hook:
     load-data       load, getStatus
     propose         submitProposals (task.create / task.update / task.complete /
                     task.reopen / rhythm.complete)
     sync            pull+push cycle, conflict handling, autoSync
     rhythm          Engine-pushed repeating occurrences (no repeats computed here)
     identity        recordId + blockId resolution / re-resolve path
   Identity rules (settled, do not redesign):
     - Task key = recordId (owning Project / task_collection record) + blockId
       (the task's inline anchor). IDs are opaque strings; never parse them.
     - Ordinary checklist items are anonymous; lists are NEVER auto-converted.
     - Identity is scoped to vaultId. Missing / duplicate identity => stop.
     - contentHash supports conflict checks; it is not identity.
   ========================================================================== */

const MON=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const fmtDay=s=>{const d=new Date(s+'T12:00');const diff=Math.round((d-new Date(todayStr()+'T12:00'))/DAY);
  if(diff===0)return 'Today'; if(diff===1)return 'Tomorrow'; if(diff===-1)return 'Yesterday';
  if(diff>1&&diff<7)return d.toLocaleDateString(undefined,{weekday:'long'});
  return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})};
const fmtShort=s=>{const d=new Date(s+'T12:00');const diff=Math.round((d-new Date(todayStr()+'T12:00'))/DAY);
  if(diff===0)return 'today'; if(diff===1)return 'tomorrow'; if(diff<0)return Math.abs(diff)+'d ago'; if(diff<7)return d.toLocaleDateString(undefined,{weekday:'short'}); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})};
const isDate=w=>/^\d{4}-\d{2}-\d{2}$/.test(w||'');
/** Parse a date phrase at the START of s. Returns {date, len} or null. */
function parseDateAt(s){
  let m, t=s.toLowerCase();
  if(m=t.match(/^(today|tod)\b/))return {date:todayStr(),len:m[0].length};
  if(m=t.match(/^(tomorrow|tmrw?|tmr)\b/))return {date:addDays(1),len:m[0].length};
  if(m=t.match(/^in (\d{1,3}) ?(d|days?|w|wks?|weeks?)\b/))return {date:addDays(+m[1]*(/^w/.test(m[2])?7:1)),len:m[0].length};
  if(m=t.match(/^(next )?(sun|mon|tue|wed|thu|fri|sat)[a-z]*\b/)){const w=WD.indexOf(m[2]),now=new Date().getDay();let d=(w-now+7)%7||7;if(m[1])d+=d<7&&w>now?7:0;return {date:addDays(d),len:m[0].length}}
  if(m=t.match(/^next week\b/)){const now=new Date().getDay();return {date:addDays(((8-now)%7)||7),len:m[0].length}}
  if(m=t.match(/^(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]* (\d{1,2})(st|nd|rd|th)?\b/)){const d=new Date();d.setHours(12,0,0,0);d.setMonth(MON.indexOf(m[1]),+m[2]);if(ymd(d)<todayStr())d.setFullYear(d.getFullYear()+1);return {date:ymd(d),len:m[0].length}}
  if(m=t.match(/^(\d{1,2})\/(\d{1,2})\b/)){const d=new Date();d.setHours(12,0,0,0);d.setMonth(+m[1]-1,+m[2]);if(ymd(d)<todayStr())d.setFullYear(d.getFullYear()+1);return {date:ymd(d),len:m[0].length}}
  return null;
}
/** Quick-entry parser: returns {title, when, deadline, recordId, doing, chips[]} */
function parseEntry(raw,ctx){
  let s=' '+raw+' ', out={when:ctx.when===undefined?null:ctx.when,deadline:null,recordId:ctx.recordId||null,doing:false,chips:[]};
  const cut=(i,len)=>{s=s.slice(0,i)+' '+s.slice(i+len)};
  // #project
  let m=s.match(/\s#([\w-]+(?: [\w-]+)?)/);
  if(m){const q=m[1].toLowerCase();const pj=S.projects.filter(p=>!p.system).find(p=>p.title.toLowerCase().includes(q))||S.projects.filter(p=>!p.system).find(p=>p.title.toLowerCase().includes(q.split(' ')[0]));
    if(pj){out.recordId=pj.recordId;const used=pj.title.toLowerCase().includes(q)?m[0]:' #'+m[1].split(' ')[0];cut(s.indexOf(used),used.length)}}
  // @tag (tags). '#' stays = project. Unknown @words become new tags on save.
  out.tags=[];s=s.replace(/\s@([\w-]+)/g,(m0,w)=>{const q=w.toLowerCase();const t=S.tags.find(x=>!x.archived&&(x.id===q||slug(x.name)===q));out.tags.push(t?t.id:'new:'+q);return ' '});
  m=s.match(/\s(due|by|deadline) /i);
  if(m){const r=parseDateAt(s.slice(m.index+m[0].length));if(r){out.deadline=r.date;cut(m.index,m[0].length+r.len)}}
  const kw=[[/\s(tonight|this evening|evening)\b/i,'evening'],[/\ssomeday\b/i,'someday'],[/\ssoon\b/i,'soon'],[/\sanytime\b/i,'anytime']];
  for(const [re,w] of kw){m=s.match(re);if(m){out.when=w;cut(m.index,m[0].length)}}
  m=s.match(/\sdoing\b/i); if(m){out.doing=true;cut(m.index,m[0].length)}
  // first date phrase anywhere
  for(let i=0;i<s.length;i++){if(s[i]!==' ')continue;const r=parseDateAt(s.slice(i+1));if(r){
      const ev=out.when==='evening'; out.when=r.date===todayStr()?(ev?'evening':'today'):r.date; cut(i,r.len+1);break}}
  out.title=s.replace(/\s+/g,' ').trim();
  const pj=S.projects.find(p=>p.recordId===out.recordId);
  out.chips.push(pj&&!pj.system?['proj','→ '+pj.title]:['proj','→ Inbox']);
  if(out.when)out.chips.push(['when',whenLabel(out.when)]);
  if(out.deadline)out.chips.push(['dl','Due '+fmtShort(out.deadline)]);
  if(out.doing)out.chips.push(['doing','Doing']);
  for(const id of out.tags)out.chips.push(['tag:'+id,'@'+(id.startsWith('new:')?id.slice(4)+' (new)':tagName(id))]);
  return out;
}

/** Queue a proposal and apply it optimistically to the local cache.
 *  INTEGRATION POINT: propose — op names mirror the Engine's supported operations;
 *  only ops the protocol-1 / planner contract supports should be enabled. No delete/restore here. */
function propose(op,t,patch={}){
  const at=isoNow(), key=taskKey(t); if(S.confirmed)delete S.confirmed[key];
  if(op==='task.create'){const tmp='^tmp-'+Math.random().toString(36).slice(2,7);
    const nt={...patch,recordId:patch.recordId,blockId:tmp,vaultId:S.vault.vaultId,status:'open',completedAt:null,rhythm:null,checklist:[],createdAt:at,_temp:true};
    S.tasks.push(nt);

    persist();return nt}

  const create=S.queue.find(p=>p.op==='task.create'&&p.tempKey===key);
  if(create&&op==='task.update'){Object.assign(create.patch,patch);Object.assign(t,patch);persist();return t}

  if(op==='task.reopen'){const i=S.queue.findIndex(p=>(p.op==='task.complete'||p.op==='rhythm.complete')&&p.target.recordId===t.recordId&&p.target.blockId===t.blockId);

  const prev=S.queue.find(p=>p.op==='task.update'&&op==='task.update'&&p.target.recordId===t.recordId&&p.target.blockId===t.blockId);
  if(prev){Object.assign(prev.patch,patch);prev.at=at}

/* ---- INTEGRATION POINT: sync ----

async function sync({silent}={}){
  if(S.syncing)return; S.syncing=true; document.body.classList.add('syncing'); renderTop();
  try{
    const seen=new Set(), batch=S.queue.map(p=>{const k=p.target.recordId+'#'+p.target.blockId;const q={...p};if(seen.has(k))q.baseHash=null;seen.add(k);return q});

    S.issues.push(...bad.map(r=>({...r,at:isoNow(),proposal:S.queue.find(p=>p.id===r.proposalId)})));

  }catch(e){toast(e.code==='offline'?'Offline — changes stay queued. Try again later.':'Sync failed: '+e.message);S.offline=e.code==='offline'}

function tpList(){const q=TP.q.toLowerCase();return S.tags.filter(g=>!g.archived&&(!q||g.name.toLowerCase().includes(q)||g.id.includes(q)))}
function renderTP(){const t=byKey(TP.key);if(!t){closeTP();return}const l=tpList(),cur=new Set(t.tags||[]);TP.hi=Math.min(TP.hi,Math.max(0,l.length-1));

function tpToggle(id){const t=byKey(TP.key);const s=new Set(t.tags||[]);s.has(id)?s.delete(id):s.add(id);propose('task.update',t,{tags:[...s]});renderTP();render()}

$('#ovTag').addEventListener('keydown',e=>{if(!TP)return;const l=tpList();
  if(e.key==='ArrowDown'){TP.hi=Math.min(l.length-1,TP.hi+1);renderTP();$('#tpIn').focus();e.preventDefault()}
  else if(e.key==='ArrowUp'){TP.hi=Math.max(0,TP.hi-1);renderTP();$('#tpIn').focus();e.preventDefault()}
  else if(e.key==='Enter'){e.preventDefault();if(l[TP.hi]&&(!TP.q||l.length))tpToggle(l[TP.hi].id);else if(TP.q.trim()){const id=ensureTag(TP.q.trim());TP.q='';tpToggle(id)}$('#tpIn').focus()}

/* ---- Doing triage ---- */
let TRI=null;
const TRI_OPTS=[['t','today','Today','schedule'],['m','tomorrow','Tomorrow','schedule'],['n','soon','Soon','schedule'],['u','upcoming','Upcoming…','schedule · pick date'],['o','someday','Someday','schedule'],['k','keep','Skip','no change'],['l','notdoing','Not doing','status only']];
function openTriage(){const l=tasksFor('doing').filter(t=>t.status==='open');if(!l.length){toast('Nothing in Doing');return}
  TRI={keys:l.map(taskKey),i:0,log:[]};$('#ovTri').hidden=false;renderTri()}
function renderTri(){const t=TRI&&byKey(TRI.keys[TRI.i]);
  if(!t){$('#tri').innerHTML=`<div class="prog"><span>Doing review</span><span>done</span></div><div class="card"><b>Review complete</b><div class="idline">${TRI.log.length} decision${TRI.log.length===1?'':'s'} queued as proposals. Sync to send them.</div></div><div class="log">${TRI.log.map(x=>esc(x)).join('<br>')}</div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn" data-tri-close>Close <kbd class="kbonly">Esc</kbd></button><button class="btn pri" data-tri-sync>Sync now <kbd class="kbonly">${MOD}U</kbd></button></div>`;return}
  const p=projOf(t),st=p&&stOf(p.stewardshipId);
  $('#tri').innerHTML=`<div class="prog"><span>Doing review</span><span>${TRI.i+1} / ${TRI.keys.length}</span></div>
   <div class="card"><b>${esc(t.title)}</b><div class="idline" style="opacity:.9">Status <b>${t.doing?'Doing':'Not doing'}</b> · Schedule <b>${esc(t.when?whenLabel(t.when):'Inbox (unscheduled)')}</b> — schedule keys change only the schedule; L changes only status.</div><div class="task" style="padding:0;min-height:0"><div class="meta">${esc(st?st.name+' › ':'')}${esc(p?p.title:'')} ${t.when?`<span class="tag">${esc(whenLabel(t.when))}</span>`:''}${t.deadline?`<span class="tag dl">Due ${esc(fmtShort(t.deadline))}</span>`:''}</div></div></div>
   <div class="opts">${TRI_OPTS.map(([k,a,l,s],i)=>`<button data-tri="${a}"><span>${l}</span><kbd class="kbonly">${k.toUpperCase()}</kbd><small>${s}</small></button>`).join('')}</div>
   <div class="datepick" id="triDate" hidden><label>Date <input type="date" id="triDateIn" value="${addDays(7)}" min="${addDays(1)}"></label><button class="btn pri" data-tri-date>Set <kbd class="kbonly">↵</kbd></button></div>
   <div class="log">${TRI.log.slice(-4).map(x=>esc(x)).join('<br>')}</div>`;
  $('#tri [data-tri]').focus()}
function triDo(a,date){const t=byKey(TRI.keys[TRI.i]);if(!t)return;
  if(a==='upcoming'&&!date){$('#triDate').hidden=false;$('#triDateIn').focus();return}
  if(a==='today')propose('task.update',t,{when:'today',doing:true});
  else if(a==='tomorrow')propose('task.update',t,{when:addDays(1)});
  else if(a==='soon')propose('task.update',t,{when:'soon'});
  else if(a==='upcoming')propose('task.update',t,{when:date});
  else if(a==='someday')propose('task.update',t,{when:'someday'});
  else if(a==='notdoing')propose('task.update',t,{doing:false});
  TRI.log.push(`${t.title} → ${a==='keep'?'skipped':a==='notdoing'?'status: not doing (schedule unchanged)':a==='upcoming'?fmtDay(date):whenLabel(a==='tomorrow'?addDays(1):a)}`);
  TRI.i++;renderTri();render()}
function closeTri(){$('#ovTri').hidden=true;TRI=null;render()}

  if(e.target.closest('[data-tagmode]')){S.tagFilter.mode=S.tagFilter.mode==='and'?'or':'and';persist();render();return}
  if(e.target.closest('[data-tagclear]')){S.tagFilter.ids=[];persist();render();return}
  const ta=e.target.closest('[data-tagarch]');if(ta){const g=tagOf(ta.closest('[data-tagid]').dataset.tagid);g.archived=!g.archived;S.tagFilter.ids=S.tagFilter.ids.filter(x=>x!==g.id||!g.archived);S.tagManageOpen=true;saveTags();render();toast((g.archived?'Archived ':'Restored ')+g.name+' (tasks keep the tag)');return}

  if(e.target.closest('[data-tpnew]')){const id=ensureTag(TP.q.trim());TP.q='';tpToggle(id);return}

const typing=e=>/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
document.addEventListener('keydown',e=>{
  const mod=isMac?e.metaKey:e.ctrlKey, k=e.key.toLowerCase();
  // overlays first
  if(!$('#ovQE').hidden){if(e.key==='Escape'){$('#ovQE').hidden=true;e.preventDefault()}else if(e.key==='Enter'&&(e.target.id==='qeIn'||mod)){saveQE();e.preventDefault()}return}
  if(!$('#ovTri').hidden){
    if(e.key==='Escape'){closeTri();e.preventDefault();return}
    if(mod&&k==='u'){closeTri();sync();e.preventDefault();return}
    if(e.target.id==='triDateIn'){if(e.key==='Enter'){triDo('upcoming',e.target.value);e.preventDefault()}return}
    const o=TRI_OPTS.find(x=>x[0]===k);if(o&&!mod&&TRI&&byKey(TRI.keys[TRI.i])){triDo(o[1]);e.preventDefault();return}
    const n=+e.key;if(n>=1&&n<=7&&TRI&&byKey(TRI.keys[TRI.i])){triDo(TRI_OPTS[n-1][1]);e.preventDefault()}return}
  if(!$('#ovTag').hidden)return;
  if(!$('#ovPanel').hidden){if(e.key==='Escape'){$('#ovPanel').hidden=true;document.activeElement&&document.activeElement.blur();e.preventDefault()}return}
  if(typing(e))return;
  if(mod&&!e.shiftKey&&!e.altKey){
    const map={g:()=>S.sel&&openTagPicker(S.sel),j:()=>go('tags'),'.':()=>toggleDensity(),i:()=>openQE(),u:()=>sync(),e:()=>openTriage(),k:()=>S.sel&&toggleDone(S.sel),b:()=>{const a=$('#app');a.style.gridTemplateColumns=a.style.gridTemplateColumns?'':'0 1fr';$('#side').style.display=a.style.gridTemplateColumns?'none':''}};
    if(map[k]){e.preventDefault();map[k]();return}
    if(/^[1-8]$/.test(k)){e.preventDefault();go(VIEWS[+k-1][0]);return}
    return}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='?'){help();e.preventDefault();return}
  if(e.key==='`'){const i=THEMES.findIndex(t=>t.id===S.settings.theme);applyTheme(THEMES[(i+1)%THEMES.length].id);return}
  if(/^[1-8]$/.test(e.key)){go(VIEWS[+e.key-1][0]);return}
  if(k==='n'){openQE();e.preventDefault();return}
  if(k==='v'){toggleDensity();return}
  if(k==='f'){go('tags');return}
  if(e.key==='ArrowDown'||k==='j'||e.key==='ArrowUp'||k==='k'){e.preventDefault();if(!ORDER.length)return;const i=ORDER.indexOf(S.sel);const d=(e.key==='ArrowUp'||k==='k')?-1:1;S.sel=ORDER[Math.max(0,Math.min(ORDER.length-1,i<0?0:i+d))];render();const el=$(`.task[data-key="${CSS.escape(S.sel)}"]`);el&&el.scrollIntoView({block:'nearest'});return}
  if(!S.sel)return;
  if(e.key==='Enter'){S.open=S.open===S.sel?null:S.sel;render();return}
  if(e.key===' '||k==='x'){e.preventDefault();toggleDone(S.sel);return}
  const w={t:'today',e:'evening',m:'tomorrow',s:'soon',o:'someday'}[k];if(w){setWhen(S.sel,w);return}
  if(k==='d'){toggleDoing(S.sel);return}
  if(k==='g'){e.preventDefault();openTagPicker(S.sel);return}
  if(e.key==='Escape'){S.sel=null;S.open=null;render()}
});

/* ---- pull to sync (touch) ---- */
(()=>{const sc=$('#scroller'),ptr=$('#ptr');let y0=null,dy=0;
  sc.addEventListener('touchstart',e=>{if(sc.scrollTop<=0&&!S.syncing){y0=e.touches[0].clientY;dy=0;ptr.classList.add('on')}},{passive:true});
  sc.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy<=0){ptr.style.height='0';return}
    e.preventDefault();const h=Math.min(90,dy*.5);ptr.style.height=h+'px';const ready=h>=60;ptr.classList.toggle('ready',ready);$('#ptrTxt').textContent=ready?'Release to sync':'Pull to sync'},{passive:false});
  const end=async()=>{if(y0==null)return;y0=null;ptr.classList.remove('on');
    if(ptr.classList.contains('ready')){ptr.style.height='44px';$('#ptrTxt').textContent='Syncing…';ptr.classList.remove('ready');await sync();}
    ptr.style.height='0'};
  sc.addEventListener('touchend',end);sc.addEventListener('touchcancel',end)})();

/* ===================== INIT ===================== */
async function init(){
  document.title=APP_NAME+' · prototype (sample data)';$('#appName').textContent=APP_NAME;$('#appBadge').textContent=DISPLAY.appBadge||'';
  $('#links').innerHTML=DISPLAY.links.map(l=>`<button class="badge" data-link="${l.id}" title="Open ${esc(l.name)}">${esc(l.badge)}</button>`).join('');
  provider=createProvider();buildThemeSelect();
  const had=restore();
  if(!had||!S.tasks.length){const snap=await provider.load();Object.assign(S,{tags:snap.tags||[],vault:snap.vault,stewardships:snap.stewardships,projects:snap.projects,tasks:snap.tasks});persist()}
  const q=new URLSearchParams(location.search);if(q.get('theme'))S.settings.theme=q.get('theme');if(q.get('view'))S.view=q.get('view');
  applyTheme(S.settings.theme,{silent:true});scheduleAutoSync();render();
  setInterval(renderTop,30000);
}
init().catch(e=>{console.error(e);document.body.insertAdjacentHTML('beforeend','<pre style="position:fixed;bottom:0;background:#fff;color:#000">'+esc(e.stack)+'</pre>')});
})();
</script>
</body>
