<meta name="description" content="StewardOS Calendar · planning prototype v0.4.0 · eleven live-switchable styles · fictional session data only">
<meta name="color-scheme" content="dark light">
<title>StewardOS Calendar · v0.4.0 prototype (fictional session data)</title>
<!-- StewardOS Calendar prototype v0.4.0 · companion to Boards v0.5 · CONTRACT 1.0.0 session mock + proposed calendar layer.
     Self-contained and offline: no network, remote assets, storage, endpoints or credentials. Reload resets.
     Built from src/ by build.cjs. Style via #theme=<id> (mission-control, x-dark, starship-blueprint, mars-dawn, field-journal, cartographer, garden-almanac, schoolhouse, hearth, click-wheel, click-wheel-black); view via #view=day|week|month|90; date via #date=YYYY-MM-DD. -->
<style>
/* board base */
html[data-theme] *{box-sizing:border-box}
html[data-theme]{-webkit-text-size-adjust:100%}
html[data-theme] body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink)}
html[data-theme] button,html[data-theme] input,html[data-theme] select{font:inherit;color:inherit}
html[data-theme] button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
html[data-theme] button:disabled,html[data-theme] [aria-disabled="true"]{cursor:not-allowed}

html[data-theme] .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
html[data-theme] .skip{position:absolute;left:8px;top:-80px;z-index:200;padding:8px 12px;background:var(--accent);color:var(--on-accent,#000)}
html[data-theme] .skip:focus{top:8px}

html[data-theme] :focus-visible{outline:var(--focus-w,2px) solid var(--focus);outline-offset:var(--focus-off,2px)}
html[data-theme] #app:focus,html[data-theme] .view-h:focus,html[data-theme] .dlg-title:focus{outline:none}
html[data-theme] .view-h:focus-visible,html[data-theme] .dlg-title:focus-visible{outline:1px dashed var(--focus);outline-offset:4px}
html[data-theme] .shell{min-height:100vh}
html[data-theme] .top{display:flex;align-items:center}
html[data-theme] .brand{display:flex;align-items:center;gap:10px;flex:none}

html[data-theme] .brand svg{display:block;flex:none}
html[data-theme] .nav{display:flex;align-items:center}
html[data-theme] .nav-item{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;position:relative}

html[data-theme] .side-card{display:none}

html[data-theme] .filter{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
html[data-theme] .tog{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
html[data-theme] .tog-all i,html[data-theme] .tog-none i{display:none}
html[data-theme] .clock{display:inline-flex;align-items:center;gap:8px}

html[data-theme] .linkish{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
html[data-theme] .mission{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 28px}
html[data-theme] .mission-text{min-width:0;flex:1 1 420px}
html[data-theme] .back{margin-bottom:12px}
html[data-theme] .desc{max-width:760px;margin-top:6px}
html[data-theme] .tele{display:flex;flex-wrap:wrap}
html[data-theme] .tele>div{display:flex;flex-direction:column-reverse}
html[data-theme] .tele dd{margin:0}
html[data-theme] .rail,html[data-theme] .dim{display:none}
html[data-theme] .board-hint{margin:12px 0}
html[data-theme] .proj-switch{margin-left:6px}
html[data-theme] .board{display:grid;grid-template-columns:repeat(6,minmax(var(--col-min,180px),1fr));overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;align-items:stretch}

html[data-theme] .col-body{flex:1;min-height:var(--col-body-min,320px)}

html[data-theme] .card{position:relative}

html[data-theme] .fields{display:flex;flex-direction:column;gap:6px}

html[data-theme] .mk{position:relative;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;max-width:100%;min-width:0}

html[data-theme] .prog-bar{display:none}
html[data-theme] .card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}

html[data-theme] .menu .it:focus-visible{outline:none}

html[data-theme] dialog{width:720px;max-width:94vw;max-height:90vh;overflow:auto;padding:0}
html[data-theme] .dlg{padding:24px 28px;position:relative}
html[data-theme] .dlg-head{position:relative;padding-right:52px}
html[data-theme] .dlg-title{margin-top:8px}

html[data-theme] .date-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
html[data-theme] .date-box>.t-label{margin-bottom:8px}
html[data-theme] .plan-edit{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 8px}
html[data-theme] .dlg-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
html[data-theme] .dlg-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
html[data-theme] pre.raw{white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto;margin:8px 0 0;padding:10px}
html[data-theme] details summary{cursor:pointer;margin-top:6px}
html[data-theme] .strip-head{min-width:0}
html[data-theme] .strip-ctrl{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
html[data-theme] .days{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--days),minmax(var(--day-min,60px),1fr));overflow-x:auto}
html[data-theme] .day{min-width:0;position:relative}
html[data-theme] .day-items{display:flex;flex-direction:column;gap:4px;margin-top:6px}
html[data-theme] .mk-btn{display:block;max-width:100%;text-align:left}
html[data-theme] .legend{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
html[data-theme] .legend .mk-btn,html[data-theme] .legend>span{display:inline-flex}
html[data-theme] .lists-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:20px}
html[data-theme] .list-items{list-style:none;padding:0;margin:12px 0;display:grid;gap:8px}
html[data-theme] .check{display:flex;gap:10px;align-items:center}
html[data-theme] .plan-table-wrap{overflow-x:auto;margin-top:22px}

html[data-theme] .plan-table caption{text-align:left;padding-bottom:8px}
html[data-theme] .plan-table th,html[data-theme] .plan-table td{text-align:left;vertical-align:middle}
html[data-theme] .future-note{margin-top:16px}
html[data-theme] .foot{display:flex;flex-direction:column;gap:6px}
html[data-theme] .foot-row{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
html[data-theme] .directions{display:flex;flex-wrap:wrap;gap:4px 12px;margin-left:auto}
@media (prefers-reduced-motion:no-preference){
html[data-theme] .card.settle{animation:settle 420ms ease-out both}
html[data-theme] .menu{animation:menu-in 120ms ease-out both}
@keyframes settle{from{transform:translateY(-4px);box-shadow:0 0 0 2px var(--accent)}to{transform:none}}
@keyframes menu-in{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){
html[data-theme] *,html[data-theme] *::before,html[data-theme] *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media (max-width:760px){
html[data-theme] .board{grid-template-columns:repeat(6,minmax(78vw,1fr));scroll-snap-type:x mandatory}
html[data-theme] .col-body{min-height:200px}
html[data-theme] .date-grid{grid-template-columns:1fr}
html[data-theme] .mission{display:block}
html[data-theme] .tele{margin-top:14px}
html[data-theme] .days{--day-min:86px}
html[data-theme] .nav{overflow-x:auto;max-width:100%;scrollbar-width:none}
html[data-theme] .dlg{padding:18px 16px}
html[data-theme] .directions{margin-left:0}
}
html[data-theme] .fld .mk,html[data-theme] .day-items .mk{white-space:normal;flex-wrap:wrap;row-gap:2px}
html[data-theme] .fld .mk-label,html[data-theme] .day-items .mk-label{overflow:visible;white-space:normal}
html[data-theme] .card-foot{flex-wrap:wrap;row-gap:6px}
@media (max-width:760px){
html[data-theme] .dim{display:none!important}
html[data-theme] .clock{display:none!important}
}
html[data-theme] .pstat small{font-size:inherit}
html[data-theme] .done-star{display:none}
html[data-theme] .col-sub{display:block;opacity:.85}
html[data-theme] .col-name{position:relative}

/* board theme: mission-control */
html[data-theme="mission-control"]{--bg:#05070a;--panel:#0b1117;--line:rgba(255,255,255,.14);--line-2:rgba(255,255,255,.28);
  --ink:#f2f5f7;--muted:#9aa6b2;--dim:#808c98;--accent:#5ee3ff;--accent-dim:rgba(94,227,255,.14);--on-accent:#00141a;
  --focus:var(--accent);--focus-w:1px;--focus-off:2px;color-scheme:dark;}
html[data-theme="mission-control"] body{background:var(--bg);background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(94,227,255,.06),transparent 70%);background-attachment:fixed}
html[data-theme="mission-control"] :focus-visible{box-shadow:0 0 0 5px rgba(94,227,255,.16)}
html[data-theme="mission-control"] .top{height:52px;padding:0 28px;border-bottom:1px solid var(--line);gap:28px}
html[data-theme="mission-control"] .brand-sub{color:var(--dim)}
html[data-theme="mission-control"] .nav{height:100%;gap:2px}
html[data-theme="mission-control"] .nav-item{height:100%;padding:0 14px;color:var(--muted)}
html[data-theme="mission-control"] .nav-item:hover{color:var(--ink)}
html[data-theme="mission-control"] .nav-item[aria-current="page"]{color:var(--ink)}
html[data-theme="mission-control"] .nav-item[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--accent)}
html[data-theme="mission-control"] .nav-future small{color:var(--dim)}
html[data-theme="mission-control"] .toolbar{padding:8px 28px;border-bottom:1px solid var(--line);color:var(--muted)}
html[data-theme="mission-control"] .filter-label{color:var(--dim);margin-right:6px}

html[data-theme="mission-control"] .tog[aria-pressed="true"] i{background:var(--accent);border-color:var(--accent)}

html[data-theme="mission-control"] #app{padding:20px 28px 8px}

html[data-theme="mission-control"] .desc{color:var(--muted)}
html[data-theme="mission-control"] .h1,html[data-theme="mission-control"] .t-h1{margin-top:6px}

html[data-theme="mission-control"] .rail{display:block;position:relative;margin:18px 0 0;height:44px}

  --desk:radial-gradient(ellipse at 15% 0,rgba(111,143,58,.10),transparent 50%),radial-gradient(ellipse at 100% 100%,rgba(201,149,43,.12),transparent 50%),#f1e8cc;
  --page:transparent;
  --hd-bg:linear-gradient(180deg,#46632f,#3a5428);--hd-ink:#f6efd6;--hd-muted:#dfe5c6;--hd-line:rgba(246,239,214,.32);--hd-on-bg:#efe2b8;--hd-on-ink:#2f4420;--hd-focus:#f2c94c;
  --col-bg:linear-gradient(180deg,rgba(111,143,58,.14),rgba(111,90,50,.10));--col-line:rgba(63,90,44,.35);--col-ink:#2f4420;--col-muted:#475330;
  --paper:#f3e4b9;--paper-solid:#f3e4b9;--paper-2:#efe6c8;--card-ink:#2e2414;--card-muted:#584729;--card-line:rgba(90,70,30,.3);--card-line-strong:rgba(70,55,25,.6);
  --tag-bg:rgba(63,90,44,.12);--tag-ink:#2f4420;--tag-line:rgba(63,90,44,.45);
  --signal:#8a3b1c;--on-signal:#fff6e0;--pl-line:#3a5528;
  --btn-bg:rgba(255,250,232,.5);--btn-ink:#2f4420;--btn-line:rgba(47,68,32,.5);--pri-bg:#3a5528;--pri-ink:#f6efd6;
  --menu-bg:#fbf4dc;--menu-ink:#2b2a1a;--menu-muted:#584729;--menu-hi-bg:#3a5528;--menu-hi-ink:#f6efd6;
  --dlg-paper:#fbf4dc;--focus:#8a3b1c;--r:10px;--card-r:4px;
  --moon-dark:#3d3f2e;--moon-lit:#fbf3c4;
  --season-bg:linear-gradient(90deg,#b7cf86 0 25%,#7ea64a 25% 50%,#d08a3a 50% 75%,#b9c4cc 75%);
  --f-head:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--f-body:Georgia,"Iowan Old Style",serif;}
html[data-theme="garden-almanac"] .top{position:relative}
html[data-theme="garden-almanac"] .col{border-radius:14px 14px 6px 6px}
html[data-theme="garden-almanac"] .colh{border-bottom:1px dashed var(--col-line)}
html[data-theme="garden-almanac"] .col-name{gap:1px}
html[data-theme="garden-almanac"] .col-sub{font-weight:600}
html[data-theme="garden-almanac"] .col-sub::before{content:"";display:inline-block;width:9px;height:13px;margin-right:5px;border-radius:0 100% 0 100%;background:#6f8f3a;vertical-align:-1px;transform:rotate(20deg)}
html[data-theme="garden-almanac"] .card{padding-top:16px;border-radius:2px 2px 6px 6px;overflow:hidden;
  background:linear-gradient(180deg,var(--subj,#7ea64a) 0 7px,transparent 7px),radial-gradient(circle at 100% 100%,rgba(111,143,58,.12),transparent 40%),#f3e4b9}
html[data-theme="garden-almanac"] .card::before{content:"";position:absolute;left:0;right:0;top:7px;height:6px;background:radial-gradient(circle at 5px 0,var(--subj,#7ea64a) 3.5px,transparent 4px) 0 0/10px 6px repeat-x}
html[data-theme="garden-almanac"] .card::after{content:"";position:absolute;right:10px;bottom:30px;width:22px;height:36px;border-radius:0 100% 0 100%;background:rgba(111,143,58,.16);transform:rotate(30deg);pointer-events:none}
html[data-theme="garden-almanac"] .card.kind-inline{background:linear-gradient(180deg,var(--subj,#7ea64a) 0 7px,transparent 7px),#efe6c8}
html[data-theme="garden-almanac"] .card-id::before{content:"No. ";opacity:.85}
html[data-theme="garden-almanac"] .card-kind{position:relative;z-index:0}
html[data-theme="garden-almanac"] .tag{border-radius:999px}
html[data-theme="garden-almanac"] .mk-dl{border-radius:999px}
html[data-theme="garden-almanac"] .day-h{flex-wrap:wrap}
html[data-theme="garden-almanac"] .day .moon{margin-left:auto}
html[data-theme="garden-almanac"] .season{background:rgba(255,250,232,.7);border:1px solid var(--card-line);border-radius:10px;padding:6px 12px}
html[data-theme="garden-almanac"] .strip .season{grid-column:1/-1}
html[data-theme="garden-almanac"] .day.has-dl{box-shadow:inset 0 0 0 2px var(--signal)}

  --page:transparent;
  --chalk:radial-gradient(ellipse at 20% 30%,rgba(255,255,255,.07),transparent 40%),radial-gradient(ellipse at 80% 70%,rgba(255,255,255,.05),transparent 45%),#24382c;
  --hd-bg:var(--chalk);--hd-ink:#f6f1e1;--hd-muted:#d3dccf;--hd-line:rgba(246,241,225,.3);--hd-on-bg:#f6f1e1;--hd-on-ink:#1f3326;--hd-focus:#f2c94c;
  --col-bg:rgba(255,255,255,.7);--col-line:rgba(31,42,68,.22);--col-ink:#1f2a44;--col-muted:#465066;
  --paper:repeating-linear-gradient(180deg,transparent 0 21px,rgba(80,130,200,.14) 21px 22px),linear-gradient(180deg,transparent 0 30px,rgba(200,60,60,.4) 30px 31px,transparent 31px),#ffffff;--paper-solid:#fff;--paper-2:#fdfcf6;
  --card-ink:#1f2a44;--card-muted:#4a5469;--card-line:rgba(31,42,68,.2);--card-line-strong:rgba(31,42,68,.5);
  --tag-bg:#fff;--tag-ink:#1f2a44;--tag-line:rgba(31,42,68,.35);
  --signal:#a52a24;--on-signal:#fff;--pl-line:#4a5469;
  --btn-bg:#fff;--btn-ink:#1f2a44;--btn-line:rgba(31,42,68,.45);--pri-bg:#24382c;--pri-ink:#f6f1e1;
  --menu-bg:#fff;--menu-ink:#1f2a44;--menu-muted:#4a5469;--menu-hi-bg:#24382c;--menu-hi-ink:#f6f1e1;
  --dlg-paper:#fff;--focus:#1d4ed8;--r:6px;--card-r:3px;

  --f-chalk:"Chalkboard SE","Chalkboard","Marker Felt","Segoe Print","Comic Sans MS",cursive;}
html[data-theme="schoolhouse"] .top{border-bottom:0;box-shadow:inset 0 -10px 0 #8a5a2b,inset 0 -12px 0 #6b431f,0 3px 0 rgba(0,0,0,.08);padding-bottom:20px}
html[data-theme="schoolhouse"] .t-brand{font-family:var(--f-chalk);font-weight:400;letter-spacing:.04em}
html[data-theme="schoolhouse"] .brand-sub{font-family:var(--f-chalk);font-style:normal}
html[data-theme="schoolhouse"] .nav-item[aria-current="page"]{box-shadow:0 2px 0 rgba(0,0,0,.25)}
html[data-theme="schoolhouse"] .mission{background:var(--chalk);color:#f6f1e1;border:10px solid #8a5a2b;border-bottom-width:14px;border-radius:4px;padding:16px 22px 18px;margin:18px 0 14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),0 4px 0 rgba(0,0,0,.12)}
html[data-theme="schoolhouse"] .mission .t-h1{font-family:var(--f-chalk);font-weight:400;color:#f6f1e1;text-shadow:0 0 1px rgba(255,255,255,.4)}
html[data-theme="schoolhouse"] .mission .desc{color:#dbe3d7;font-family:var(--f-chalk);font-style:normal}
html[data-theme="schoolhouse"] .mission .eyebrow,html[data-theme="schoolhouse"] .mission .pstat{color:#f2c94c}
html[data-theme="schoolhouse"] .mission .tele dt{color:#d3dccf}
html[data-theme="schoolhouse"] .mission .tele dd{color:#f6f1e1;font-family:var(--f-chalk);font-weight:400}
html[data-theme="schoolhouse"] .mission .tele .acc dd{color:#f2c94c}
html[data-theme="schoolhouse"] .mission .back{color:#f6f1e1;border-color:rgba(246,241,225,.5);background:transparent}
html[data-theme="schoolhouse"] .mission :focus-visible{outline-color:#f2c94c}
html[data-theme="schoolhouse"] .mission .linkish{color:#f2c94c}
html[data-theme="schoolhouse"] .col{border-radius:4px}
html[data-theme="schoolhouse"] .card{padding-left:17px;border-left:0;box-shadow:inset 6px 0 0 var(--subj,#9aa3b5),0 1px 0 rgba(31,42,68,.08),0 4px 10px rgba(31,42,68,.1)}
html[data-theme="schoolhouse"] .card:not([data-subject]){box-shadow:inset 6px 0 0 #c9ced8,0 4px 10px rgba(31,42,68,.1)}
html[data-theme="schoolhouse"] .tag:first-child{border-color:var(--subj,#9aa3b5);box-shadow:inset 3px 0 0 var(--subj,#9aa3b5);padding-left:9px}
html[data-theme="schoolhouse"] .card.completed .done-star{display:block;position:absolute;right:8px;top:6px;z-index:2;filter:drop-shadow(0 1px 0 rgba(0,0,0,.2))}
html[data-theme="schoolhouse"] .card.completed .done-star svg{width:26px;height:26px;transform:rotate(-8deg)}
html[data-theme="schoolhouse"] .card.completed .card-kind{padding-right:32px}
html[data-theme="schoolhouse"] .mk-dl{border-radius:3px}
html[data-theme="schoolhouse"] .mk-pl{border-style:dashed}
html[data-theme="schoolhouse"] .day{border-radius:3px}
html[data-theme="schoolhouse"] .strip-title,html[data-theme="schoolhouse"] .view-h{font-family:var(--f-head)}

html[data-theme="hearth"] .t-h1{font-weight:800;letter-spacing:0}
html[data-theme="hearth"] .t-colh,html[data-theme="hearth"] .t-title{font-weight:700}
html[data-theme="hearth"] .desc{font-style:normal}
html[data-theme="hearth"] .top{border-bottom:0;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 4px 0 #c8551f}
html[data-theme="hearth"] .top .t-brand{font-weight:800}
html[data-theme="hearth"] .board{--col-min:212px}
html[data-theme="hearth"] .col{border:2px dashed var(--col-line);background:var(--col-bg);border-radius:20px}
html[data-theme="hearth"] .col:nth-child(6n+1){background:rgba(200,85,31,.07)}
html[data-theme="hearth"] .col:nth-child(6n+2){background:rgba(201,149,43,.10)}
html[data-theme="hearth"] .col:nth-child(6n+3){background:rgba(111,143,58,.10)}
html[data-theme="hearth"] .col:nth-child(6n+4){background:rgba(60,110,160,.08)}
html[data-theme="hearth"] .col:nth-child(6n+5){background:rgba(150,90,150,.08)}
html[data-theme="hearth"] .col:nth-child(6n){background:rgba(106,58,34,.08)}
html[data-theme="hearth"] .col-ct{font-size:14px;min-width:30px;text-align:center;background:#fffaf1}
html[data-theme="hearth"] .card{border:2px solid var(--card-line);outline:1.5px dashed rgba(106,58,34,.25);outline-offset:-7px;padding:14px 15px 13px}
html[data-theme="hearth"] .card:has(.card-open:focus-visible){outline:0}
html[data-theme="hearth"] .tag{border-radius:999px;padding:2px 10px}
html[data-theme="hearth"] .mk-dl,html[data-theme="hearth"] .mk-pl{border-radius:999px;padding:5px 11px}
html[data-theme="hearth"] .btn,html[data-theme="hearth"] .tog,html[data-theme="hearth"] .back{padding:7px 14px}
html[data-theme="hearth"] .card.completed .done-star{display:block;position:absolute;right:10px;top:8px;z-index:2}
html[data-theme="hearth"] .card.completed .done-star svg{width:28px;height:28px}
html[data-theme="hearth"] .card.completed .card-kind{padding-right:34px}
html[data-theme="hearth"] .empty b{font-style:normal;font-weight:700}
html[data-theme="hearth"] .day{border-radius:14px}

/* board theme: click-wheel */
html[data-theme="click-wheel"]{--bg:#e7e9ec;--ink:#111214;--muted:#4f545c;--accent:#0a5cc7;--line:rgba(0,0,0,.14);
  --desk:radial-gradient(ellipse 60% 40% at 20% 0,rgba(255,255,255,.9),transparent 70%),linear-gradient(180deg,#eef0f2,#dfe2e6);
  --page:transparent;
  
  --anodized:radial-gradient(ellipse 70% 220% at 12% -40%,rgba(255,255,255,.6),rgba(255,255,255,0) 62%);
  --hd-bg:var(--anodized),linear-gradient(172deg,#f4f5f7,#e3e6e9 55%,#d6dade);
  --hd-ink:#111214;--hd-muted:#40454d;--hd-line:rgba(0,0,0,.2);--hd-on-bg:#1460cc;--hd-on-ink:#ffffff;--hd-focus:#0a5cc7;
  --hl-bg:linear-gradient(180deg,#2b70d2,#1460cc 48%,#0a52b6 52%,#0a4aa6);--hl-solid:#1460cc;--hl-ink:#ffffff;
  --title-bar:linear-gradient(180deg,#fbfcfd,#e9ecf0 50%,#dfe3e8 51%,#d9dde3);
  --col-bg:#ffffff;--col-line:#18191c;--col-ink:#111214;--col-muted:#4f545c;
  --paper:#ffffff;--paper-solid:#ffffff;--paper-2:#f7f8fa;--card-ink:#111214;--card-muted:#50565f;--card-line:#e1e4e8;--card-line-strong:#9aa1ab;
  --tag-bg:#eef1f5;--tag-ink:#2c3138;--tag-line:#c9ced5;
  --signal:#b42318;--on-signal:#ffffff;--pl-line:#50565f;
  --btn-bg:#ffffff;--btn-ink:#111214;--btn-line:#a3aab4;--pri-bg:#1460cc;--pri-ink:#ffffff;
  --menu-bg:#ffffff;--menu-ink:#111214;--menu-muted:#50565f;--menu-hi-bg:#1460cc;--menu-hi-ink:#ffffff;
  --dlg-paper:#ffffff;--focus:#0a5cc7;--on-focus:#ffffff;--r:12px;--card-r:0;
  --shadow:none;}
html[data-theme="click-wheel"] .top{border-bottom:1px solid #a9b0b9;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 1px 0 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.07),0 1px 0 rgba(255,255,255,.6)}
html[data-theme="click-wheel"] .top .t-brand{letter-spacing:-.01em}
html[data-theme="click-wheel"] .nav-item{border-radius:8px}
html[data-theme="click-wheel"] .nav-item[aria-current="page"]{background:var(--hl-bg);background-color:var(--hl-solid);color:var(--hl-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 1px 1px rgba(0,0,0,.25)}
html[data-theme="click-wheel"] .tog,html[data-theme="click-wheel"] .back,html[data-theme="click-wheel"] .btn{border-radius:8px;background-image:linear-gradient(180deg,#ffffff,#eef0f3);font-weight:700}
html[data-theme="click-wheel"] .tog[aria-pressed="true"],html[data-theme="click-wheel"] .btn.primary,html[data-theme="click-wheel"] dialog .btn.primary{background:var(--hl-bg);background-color:var(--hl-solid);border-color:#0a4aa6;color:#fff}
html[data-theme="click-wheel"] .mission .eyebrow{color:#0a5cc7}
html[data-theme="click-wheel"] .desc{font-style:normal}
html[data-theme="click-wheel"] .board{gap:14px}
html[data-theme="click-wheel"] .col{position:relative;border:5px solid var(--col-line);border-radius:14px;padding:0 0 6px;background:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.7),0 6px 16px rgba(0,0,0,.14);overflow:hidden}
html[data-theme="click-wheel"] .col::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:9px;background:linear-gradient(160deg,rgba(255,255,255,.22) 0,rgba(255,255,255,.05) 24%,transparent 24.2%);z-index:1}
html[data-theme="click-wheel"] .colh{position:relative;z-index:2}
html[data-theme="click-wheel"] .colh{background:var(--title-bar);border-bottom:1px solid #9ca4ae;padding:7px 10px 6px;margin:0 0 0;justify-content:space-between;align-items:center}
html[data-theme="click-wheel"] .col-idx{color:#3c424a}
html[data-theme="click-wheel"] .col-ct{background:#fff;border-color:#9ca4ae;color:#111214}
html[data-theme="click-wheel"] .col:focus-within>.colh{background:var(--hl-bg);background-color:var(--hl-solid);border-bottom-color:#0a4aa6}
html[data-theme="click-wheel"] .col:focus-within>.colh :is(.t-colh,.col-name,.col-idx,.col-sub,h2){color:#fff}
html[data-theme="click-wheel"] .col:focus-within>.colh .col-ct{background:#fff;color:#0a3f8f;border-color:#fff}
html[data-theme="click-wheel"] .empty{border:0;border-radius:0;margin:8px 10px;padding:14px 8px}
html[data-theme="click-wheel"] .card{margin:0;border:0;border-bottom:1px solid var(--card-line);border-radius:0;box-shadow:none;padding:11px 12px 10px}
html[data-theme="click-wheel"] .card:has(.card-open:focus-visible){box-shadow:none;outline:0;background:var(--hl-bg);background-color:var(--hl-solid);
  --card-ink:#fff;--card-muted:#e6efff;--card-line-strong:rgba(255,255,255,.75);--tag-bg:rgba(255,255,255,.14);--tag-ink:#fff;--tag-line:rgba(255,255,255,.6);--pl-line:#fff;--paper-solid:#0a3f8f}
html[data-theme="click-wheel"] .card:has(.card-open:focus-visible) .card-id::after{background:#fff;color:#0a4aa6}
@media (hover:hover){
html[data-theme="click-wheel"] .card:hover{background:var(--hl-bg);background-color:var(--hl-solid);--card-ink:#fff;--card-muted:#e6efff;--card-line-strong:rgba(255,255,255,.75);--tag-bg:rgba(255,255,255,.14);--tag-ink:#fff;--tag-line:rgba(255,255,255,.6);--pl-line:#fff;--paper-solid:#0a3f8f}
html[data-theme="click-wheel"] .card:hover .card-title,html[data-theme="click-wheel"] .card:hover .card-title a{color:#fff}
}
html[data-theme="click-wheel"] .card-title{letter-spacing:-.005em}
html[data-theme="click-wheel"] .tag{border-radius:999px;padding:1px 8px}
html[data-theme="click-wheel"] .mk-dl{border-radius:6px}
html[data-theme="click-wheel"] .mk-pl{border-radius:6px}
html[data-theme="click-wheel"] .menu{border-radius:12px;border:1px solid #9ca4ae;box-shadow:0 14px 34px rgba(0,0,0,.25);padding:4px 0}
html[data-theme="click-wheel"] .menu .it{border-radius:0}
html[data-theme="click-wheel"] .menu .it:hover:not([aria-disabled="true"]),html[data-theme="click-wheel"] .menu .it:focus{background:var(--hl-bg);background-color:var(--hl-solid);color:#fff}
html[data-theme="click-wheel"] .menu-h{background:var(--title-bar);border-bottom:1px solid #c9ced5;color:#2c3138;padding:6px 12px;margin:-4px 0 4px;border-radius:11px 11px 0 0}
html[data-theme="click-wheel"] .day{border:3px solid #18191c;border-radius:10px;background:#fff}
html[data-theme="click-wheel"] .day.today{box-shadow:inset 0 0 0 2px var(--accent)}
html[data-theme="click-wheel"] .day-h{background:var(--title-bar);margin:-8px -10px 6px;padding:5px 8px;border-bottom:1px solid #c9ced5;border-radius:7px 7px 0 0}
html[data-theme="click-wheel"] .list-card,html[data-theme="click-wheel"] .plan-table-wrap{border:4px solid #18191c;border-radius:14px}
html[data-theme="click-wheel"] .list-kind{color:#0a5cc7}
html[data-theme="click-wheel"] dialog{border:0;border-radius:16px;box-shadow:0 0 0 6px #18191c,0 30px 80px rgba(0,0,0,.45)}
html[data-theme="click-wheel"] dialog::backdrop{background:rgba(20,22,26,.5)}
html[data-theme="click-wheel"] .dlg-head{background:var(--title-bar);border-bottom:1px solid #9ca4ae}
html[data-theme="click-wheel"] input[type=date],html[data-theme="click-wheel"] select{background:#fff}
html[data-theme="click-wheel"] .foot{color:var(--muted)}
