<!doctype html>
<html lang="en" data-theme="hearth">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>StewardOS Compass · v0.3.0 (prototype, fictional data)</title>
<style>/* StewardOS Compass v0.2 · layout + per-theme tokens. Offline: textures are CSS gradients / inline SVG only. */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page-bg);color:var(--page-ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:48px;padding:24px}
.dev-wrap{flex:none;width:calc(414px*var(--k,1));height:calc(868px*var(--k,1))}
.device{width:414px;height:868px;border-radius:64px;padding:12px;background:linear-gradient(145deg,#3a3d42,#121315 40%,#2a2c30);box-shadow:0 0 0 1px #000,0 30px 80px rgba(0,0,0,.55),inset 0 0 0 2px rgba(255,255,255,.08);transform:scale(var(--k,1));transform-origin:0 0}
.screen{position:relative;width:390px;height:844px;border-radius:52px;overflow:hidden;background:var(--scr-bg);container-type:size;display:flex;flex-direction:column;isolation:isolate}
/* status bar */
.status{flex:none;height:50px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font:600 15px/1 -apple-system,'Segoe UI',Arial,sans-serif;color:var(--status-ink,#fff)}
.island{width:122px;height:34px;border-radius:20px;background:#000}
.bat{width:26px;height:12px;border:1.5px solid currentColor;border-radius:4px;position:relative;opacity:.9}
.bat::after{content:"";position:absolute;inset:1.5px 4px 1.5px 1.5px;background:currentColor;border-radius:1.5px}
/* lid */
.lid{position:relative;flex:1 1 auto;min-height:0;margin:2px 16px 0;padding:10px 10px 4px;border-radius:var(--lid-r,26px) var(--lid-r,26px) 14px 14px;background:var(--lid-bg);color:var(--lid-ink);display:flex;flex-direction:column;box-shadow:var(--lid-shadow,0 10px 30px rgba(0,0,0,.4));border:var(--lid-border,0)}
.lid-head{flex:none;text-align:center;padding:2px 0 6px}
.lid-title{margin:0;font:var(--head-w,600) calc(clamp(15px,4.4cqw,19px)*var(--fs,1))/1.1 var(--f-head);letter-spacing:var(--head-ls,.28em);text-transform:var(--head-tt,uppercase);font-variant:var(--head-fv,normal);color:var(--lid-ink)}
.lid-scope{margin:2px 0 0;font:italic calc(12.5px*var(--fs,1))/1.2 var(--f-body);color:var(--lid-muted);display:flex;align-items:center;justify-content:center;gap:6px}
.lid-scope .ring{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block}
.lid-scope.all .ring{background:transparent;border:1.5px solid currentColor}
.win{position:relative;flex:1 1 auto;min-height:0;border-radius:var(--win-r,14px);background:var(--win-tex,none),var(--win-bg);color:var(--win-ink);border:var(--win-border,1px solid var(--win-line));box-shadow:var(--win-shadow,inset 0 2px 10px rgba(0,0,0,.35));overflow:hidden;display:flex;flex-direction:column;touch-action:pan-y}
.win-in{flex:1 1 auto;min-height:0;overflow:auto;padding:10px 14px 12px;scrollbar-width:thin;overscroll-behavior:contain}
.win:focus-visible{outline-offset:-3px}
.wh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 6px;padding-bottom:6px;border-bottom:1px solid var(--win-line)}
.wh h2{margin:0;font:var(--wh-w,600) calc(clamp(15px,4.1cqw,17.5px)*var(--fs,1))/1.2 var(--f-head);font-variant:var(--head-fv,normal);letter-spacing:var(--wh-ls,.02em);text-transform:var(--wh-tt,none);color:var(--win-ink)}
.wh small,.meta{font:italic calc(12px*var(--fs,1))/1.3 var(--f-body);color:var(--win-muted)}
.sec{font:600 calc(11px*var(--fs,1))/1.3 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--win-muted);margin:10px 0 2px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;border-top:1px solid var(--win-line)}
.sec:first-child{margin-top:0}
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:10px;min-height:44px;border-bottom:1px dashed var(--win-line);font:calc(clamp(14px,3.75cqw,16px)*var(--fs,1))/1.25 var(--f-body);color:var(--win-ink)}
.row:last-child{border-bottom:0}
.row>button.rb,.row>.rb{flex:1;display:flex;align-items:center;gap:10px;min-height:44px;text-align:left;width:100%}
.row .t{flex:1;min-width:0}
.row .r{font:italic calc(12px*var(--fs,1))/1.2 var(--f-body);color:var(--win-muted);white-space:nowrap;text-align:right}
.row .tm{width:44px;flex:none;font:calc(11.5px*var(--fs,1))/1.2 var(--f-num);color:var(--win-muted);letter-spacing:.04em;text-transform:uppercase}
.bul{width:6px;height:6px;border-radius:50%;background:var(--win-ink);flex:none;margin-left:4px}
.row.done .t{text-decoration:line-through;color:var(--win-muted)}
.row.pend .t{opacity:.8}
.pl{font:calc(11px*var(--fs,1))/1.2 var(--f-ui);color:var(--win-muted)}
.ck{width:44px;height:44px;flex:none;display:grid;place-items:center;margin-left:-10px}
.ck i{width:20px;height:20px;border:1.6px solid var(--win-ink);border-radius:var(--ck-r,5px);display:grid;place-items:center}
.ck[aria-checked="true"] i{background:var(--win-acc);border-color:var(--win-acc)}
.ck[aria-checked="true"] i::after{content:"";width:9px;height:5px;border:2px solid var(--win-acc-ink);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.ck.pending i{border-style:dashed;animation:spin 1.2s linear infinite}
.pendtag{font:italic calc(11.5px*var(--fs,1))/1 var(--f-body);color:var(--win-muted)}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{min-height:44px;min-width:44px;padding:0 14px;border-radius:var(--btn-r,999px);border:1px solid var(--win-line-strong,var(--win-muted));color:var(--win-ink);font:600 calc(13px*var(--fs,1))/1 var(--f-ui);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--win-acc);border-color:var(--win-acc);color:var(--win-acc-ink)}
.btn[disabled]{opacity:.6;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 2px}
.back{min-height:44px;display:inline-flex;align-items:center;gap:4px;font:600 calc(13px*var(--fs,1))/1 var(--f-ui);color:var(--win-ink);margin:-8px 0 0 -4px;padding:0 4px}
.chipline{display:flex;gap:6px;flex-wrap:wrap}
.spot{min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--win-line-strong,var(--win-muted));font:calc(12.5px*var(--fs,1))/1 var(--f-ui);color:var(--win-ink)}
.spot[aria-pressed="true"]{background:var(--win-acc);color:var(--win-acc-ink);border-color:var(--win-acc)}
/* lid controls: mode chips / tabs */
.ctrls{flex:none;display:flex;justify-content:center;gap:2px;padding:4px 0 0;min-height:48px}
.ctrls:empty{min-height:8px;padding:0}
.chip{min-height:44px;min-width:44px;padding:0 10px;display:grid;place-items:center}
.chip span{display:block;padding:5px 10px;border-radius:var(--chip-r,999px);border:1px solid var(--chip-line);color:var(--lid-ink);font:600 calc(11px*var(--fs,1))/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;font-variant:var(--chip-fv,normal)}
.chip[aria-selected="true"] span,.chip[aria-pressed="true"] span{background:var(--chip-on-bg);color:var(--chip-on-ink);border-color:var(--chip-on-bg)}
.ctrls.tight .chip{padding:0 1px}.ctrls.tight .chip span{padding:5px 8px;letter-spacing:.06em}
.hint{flex:none;margin:2px 0 0;text-align:center;font:italic calc(clamp(12px,3.2cqw,13.5px)*var(--fs,1))/1.2 var(--f-body);color:var(--lid-muted);min-height:15px}
.dots{flex:none;display:flex;justify-content:center;gap:0;margin:-4px -14px -4px}
.dot{flex:none;width:44px;height:44px;display:grid;place-items:center}
.dot i{width:6px;height:6px;border-radius:50%;background:var(--lid-muted);opacity:.55;transition:transform .2s}
.dot[aria-selected="true"] i{background:var(--lid-ink);opacity:1;transform:scale(1.35)}
/* toast lives inside the window, above content */
.toast{flex:none;position:relative;margin:0 8px 8px;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;min-height:48px;border-radius:12px;background:var(--toast-bg,var(--win-ink));color:var(--toast-ink,var(--win-bg));font:calc(13px*var(--fs,1))/1.25 var(--f-ui);box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:5}
.toast[hidden]{display:none}
.toast .tx{flex:1;min-width:0}
.toast .tb+.tb{margin-left:-4px}
.toast .tb{min-height:44px;min-width:60px;padding:0 12px;border-radius:9px;font-weight:700;color:var(--toast-ink,var(--win-bg));border:1.5px solid currentColor}
.toast.pending .tx::before{content:"";display:inline-block;width:10px;height:10px;margin-right:8px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin 1s linear infinite;vertical-align:-1px}
/* hinge + case */
.hinge{flex:none;height:14px;margin:0 120px;border-radius:0 0 8px 8px;background:var(--hinge,linear-gradient(180deg,#d9b464,#7a5a24));box-shadow:0 2px 4px rgba(0,0,0,.4)}
.case{flex:none;position:relative;height:calc(min(90cqw,46cqh) + 30px);display:flex;justify-content:center;padding-top:6px}
.inst{--D:min(90cqw,46cqh);position:relative;width:var(--D);height:var(--D);touch-action:none;user-select:none;-webkit-user-select:none}
.inst svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.inst .case-art{filter:drop-shadow(0 8px 18px rgba(0,0,0,.45))}
.bezel{position:absolute;inset:0;border-radius:50%;transform:rotate(var(--rot,0deg));transition:transform var(--snap-ms,260ms) cubic-bezier(.2,.9,.3,1.2);cursor:grab}
.bezel.dragging{transition:none;cursor:grabbing}
.bezel:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
/* ring labels: 44px hit targets riding on the bezel */
.rl{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;display:grid;place-items:center;color:var(--ring-ink);transform:rotate(var(--a)) translateY(calc(var(--D)*-.425)) rotate(calc(-1*var(--a) - var(--rot,0deg)))}
.bezel.dragging .rl{transition:none}
.rl svg{position:static;width:calc(var(--D)*.058);height:calc(var(--D)*.058);min-width:17px;min-height:17px;transition:transform .2s}
.rl[aria-current="true"]{color:var(--ring-on)}
.rl[aria-current="true"] svg{transform:scale(1.12)}
.rl::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--ring-plate);box-shadow:inset 0 1px 2px rgba(0,0,0,var(--plate-sh,.45)),0 1px 0 rgba(255,255,255,var(--plate-hi,.25));z-index:-1;transition:background .2s,transform .2s}
.rl[aria-current="true"]::before{background:var(--ring-on-bg);transform:scale(1.12);box-shadow:0 1px 3px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.18)}
.rl{isolation:isolate}
.lubber-art{pointer-events:none;z-index:3}
.lub{transition:fill-opacity .2s}
.inst.all .lub{fill-opacity:0;stroke-width:1.4}
.inst.tick .lubber-art{animation:tick .14s ease-out}
@keyframes tick{40%{transform:translateY(1.6%) scale(1.04)}}
.glass{position:absolute;left:13%;top:13%;width:74%;height:74%;border-radius:50%;z-index:2;-webkit-tap-highlight-color:transparent;touch-action:none}
.glass:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.glass .face-art{pointer-events:none;inset:-17.57%;width:135.14%;height:135.14%}
.glass::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse 60% 40% at 35% 25%,rgba(255,255,255,var(--glare,.14)),transparent 60%);pointer-events:none}
.glass.holding::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:3px solid var(--focus);animation:hold .55s linear forwards}
@keyframes hold{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.ndl{transition:transform .9s cubic-bezier(.3,1.6,.5,1)}
.dst{opacity:0;transition:opacity .3s,transform .6s}
.inst.nav .dst{opacity:1}
.corner{position:absolute;bottom:4px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--corner-bg);color:var(--corner-ink);box-shadow:var(--corner-shadow,inset 0 0 0 1.5px rgba(0,0,0,.35),0 2px 4px rgba(0,0,0,.4));z-index:4}
.corner.l{left:14px}.corner.r{right:14px}
.corner svg{width:22px;height:22px}
.corner[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--focus),0 2px 4px rgba(0,0,0,.4)}
.home{flex:none;height:22px;display:grid;place-items:center}
.home::after{content:"";width:134px;height:5px;border-radius:3px;background:var(--status-ink,#fff);opacity:.8}
/* simulated viewfinders */
.vf{position:relative;height:calc(100% + 22px);min-height:120px;margin:-10px -14px -12px;display:flex;flex-direction:column}
.vf svg.scene{flex:1;width:100%;height:100%;min-height:0;display:block}
.vf .cap{position:absolute;left:10px;right:10px;bottom:6px;display:flex;justify-content:space-between;font:italic 11.5px/1.2 var(--f-body);color:#fff;text-shadow:0 1px 2px #000,0 0 6px #000}
.vf .cap b{font:600 10px/1.2 var(--f-ui);letter-spacing:.12em;font-style:normal}
.vf .tape{position:absolute;left:0;right:0;top:0;height:24px;background:rgba(0,0,0,.6);color:#fff;font:10px/24px var(--f-num);display:flex;justify-content:space-around;text-shadow:none}
.vf .tape b{color:#fff;font-weight:700}
.vf .brk{position:absolute;inset:32px 10px 26px;pointer-events:none;border:0;background:linear-gradient(#fff,#fff) 0 0/16px 2px,linear-gradient(#fff,#fff) 0 0/2px 16px,linear-gradient(#fff,#fff) 100% 0/16px 2px,linear-gradient(#fff,#fff) 100% 0/2px 16px,linear-gradient(#fff,#fff) 0 100%/16px 2px,linear-gradient(#fff,#fff) 0 100%/2px 16px,linear-gradient(#fff,#fff) 100% 100%/16px 2px,linear-gradient(#fff,#fff) 100% 100%/2px 16px;background-repeat:no-repeat;opacity:.85}
.vf .mid{position:absolute;left:50%;top:24px;bottom:0;border-left:1px solid rgba(255,255,255,.5)}
.flash{animation:flash .35s ease-out}
@keyframes flash{0%{filter:brightness(3)}100%{filter:none}}
.scanline{position:absolute;left:22%;right:22%;height:2px;background:#7cf;box-shadow:0 0 8px #7cf;top:30%;animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{to{top:70%}}
.wave{display:flex;align-items:center;justify-content:center;gap:3px;height:60px;margin:6px 0}
.wave i{width:4px;border-radius:2px;background:var(--win-acc);height:8px}
.wave.on i{animation:wv .9s ease-in-out infinite alternate}
@keyframes wv{to{height:var(--h,40px)}}
textarea.tx{width:100%;min-height:84px;resize:none;border-radius:10px;border:1px solid var(--win-line-strong,var(--win-muted));background:transparent;color:var(--win-ink);font:calc(15px*var(--fs,1))/1.4 var(--f-body);padding:10px}
textarea.tx::placeholder{color:var(--win-muted);opacity:1}
.big{font:calc(13.5px*var(--fs,1))/1.4 var(--f-body);color:var(--win-ink);margin:4px 0}
.readout{display:flex;justify-content:flex-end;align-items:center;gap:6px;font:calc(12px*var(--fs,1))/1.2 var(--f-num);color:var(--win-ink);letter-spacing:.04em}
.nav-map{flex:1;min-height:0;position:relative;margin:0 -14px}
.nav-map svg{position:absolute;inset:0;width:100%;height:100%}
.nav-ro{position:absolute;right:12px;bottom:6px;padding:4px 8px;border-radius:8px;background:var(--win-bg);font:calc(12.5px*var(--fs,1))/1.2 var(--f-num);color:var(--win-ink);letter-spacing:.03em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-grid .dw{font:600 10px/1.6 var(--f-ui);color:var(--win-muted);letter-spacing:.08em}
.cal-grid button{min-height:44px;border-radius:8px;font:calc(12.5px*var(--fs,1))/1 var(--f-num);color:var(--win-ink);position:relative}
.cal-grid button.has::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--win-acc)}
.cal-grid button.today{outline:1.5px solid var(--win-ink)}
.cal-grid button.out{color:var(--win-muted)}
.wk{display:grid;grid-template-columns:52px 1fr;gap:4px 8px;font:calc(13px*var(--fs,1))/1.3 var(--f-body)}
.wk .d{font:600 calc(11px*var(--fs,1))/1.3 var(--f-ui);color:var(--win-muted);letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.wk .d.today{color:var(--win-ink)}
.wk .e{min-height:22px;border-bottom:1px dashed var(--win-line);padding-bottom:3px}
.empty{color:var(--win-muted);font:italic calc(13px*var(--fs,1))/1.4 var(--f-body);padding:8px 0}
/* settings sheet (phone + desktop) */
.sheet{position:absolute;inset:auto 0 0 0;max-height:78%;overflow:auto;z-index:20;background:var(--sheet-bg,#fff);color:var(--sheet-ink,#111);border-radius:22px 22px 0 0;padding:14px 18px 26px;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.sheet[hidden]{display:none}
.sheet h2{margin:0 0 8px;font:600 17px/1.2 var(--f-head)}
.sheet .opt{display:flex;align-items:center;gap:10px;min-height:44px;width:100%;text-align:left;border-bottom:1px solid rgba(127,127,127,.25);font:14px/1.2 var(--f-ui)}
.sheet .opt[aria-checked="true"]{font-weight:700}
.sheet .opt[aria-checked="true"]::after{content:"✓";margin-left:auto}
.sheet .sw{width:22px;height:22px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.3)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:19}
.scrim[hidden]{display:none}
/* design notes panel */
.notes{width:400px;max-width:100%;max-height:calc(100vh - 48px);overflow:auto;padding:26px 28px;border-radius:var(--notes-r,6px);background:var(--notes-bg);color:var(--notes-ink);border:1px solid var(--notes-line);box-shadow:var(--notes-shadow,none)}
.notes h1{margin:0 0 4px;font:var(--head-w,600) 26px/1.1 var(--f-head);font-variant:var(--head-fv,normal);letter-spacing:var(--notes-ls,.04em);text-transform:var(--notes-tt,none)}
.notes .kick{margin:0 0 14px;font:italic 14px/1.4 var(--f-body);color:var(--notes-muted)}
.notes p,.notes li{font:15px/1.5 var(--f-body)}
.notes ul{padding-left:18px;margin:8px 0 14px}
.notes li{margin:0 0 6px}
.notes b.sc{font-variant:small-caps;letter-spacing:.06em}
.notes h3{margin:18px 0 6px;font:700 11.5px/1.3 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--notes-muted)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tgrid button{min-height:44px;text-align:left;padding:6px 10px;border-radius:8px;border:1px solid var(--notes-line);font:13px/1.15 var(--f-ui);color:var(--notes-ink)}
.tgrid button[aria-pressed="true"]{background:var(--notes-ink);color:var(--notes-bg);font-weight:700}
.tgrid small{display:block;opacity:.85;font-size:11px}
.ctl{display:flex;flex-wrap:wrap;gap:6px}
.ctl button,.ctl select{min-height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--notes-line);background:transparent;color:var(--notes-ink);font:13px var(--f-ui)}
.ctl select option{color:#111;background:#fff}
.notes .fine{font:12.5px/1.45 var(--f-ui);color:var(--notes-muted)}
/* phone widths: the page IS the phone */
@media (max-width:600px){
  .stage{padding:0;display:block}
  .dev-wrap{width:100%;height:100dvh}
  .device{width:100%;height:100%;padding:0;border-radius:0;background:none;box-shadow:none;transform:none}
  .screen{width:100%;height:100%;border-radius:0}
  .status{padding-top:0}
  .notes{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
html.rm *,html.rm *::before,html.rm *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}

/* ======================= THEMES ======================= */
:root{--f-ui:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;--focus:#1f6fff}

      '<li><b class="sc">Navigate</b> (iPhone only) · <b class="sc">Place</b> shows what’s due, invitations, the last capture and the spots · <b class="sc">Calendar</b> has Day, Week and Month tabs · <b class="sc">Tasks</b> · <b class="sc">Lists</b> shows this place’s lists first · <b class="sc">Projects</b> includes invitations · <b class="sc">Notes</b>.</li>' +
      '<li><b class="sc">Here or everywhere:</b> everything follows the nearest place within half a mile. <b>Hold the glass</b> to see all places: the lubber mark goes hollow and the lid says “all places”. It returns to here when you arrive somewhere or after three idle minutes. Away from every place, the lid shows the nearest one and nothing is filtered.</li>' +
      '<li>Saves are mock and asynchronous. They show <i>pending</i> first, never “saved” until the mock confirms, and every save can be undone.</li></ul>' +
      '<h3>Theme</h3><div class="tgrid">' + themeOpts('notes') + '</div>' + (alu() ? '<h3>Finish</h3>' + finishOpts() : '') +
      '<h3>Away from any place, file captures to</h3>' + awayOpts() +
      '<h3>Open in the other StewardOS apps</h3>' + appLinks() + (st.theme === 'brass' ? '<p class="fine">Brass has no Boards/Calendar twin; links open Hearth.</p>' : '') +
      '<h3>Simulate</h3><div class="ctl">' + locSelect('locN') + '<button type="button" data-sim="hold">' + (s.mode === 'all' ? 'Return to here' : 'Hold the glass') + '</button><button type="button" data-sim="idle">Skip 3 idle minutes</button><button type="button" data-sim="fail">Fail next save</button><button type="button" data-sim="rm" aria-pressed="' + document.documentElement.classList.contains('rm') + '">Reduce motion</button></div>' +
      '<p class="fine">All data is fictional. Nothing is saved or sent; reload resets everything. The camera, microphone, GPS, QR and NFC are simulated. Open on a phone (or under 600 px) for the full-screen view; the ⚙ corner button has the same controls.</p>';
    if (keep) { var k = el.querySelector(keep); if (k) k.focus(); }
  }
  function renderSheet() {
    var sh = $('sheet');
    sh.innerHTML = '<h2 id="sheetH">Compass settings</h2><div role="menu" aria-label="Theme">' + themeOpts('sheet') + '</div>' + (alu() ? '<h2 style="margin-top:14px">Finish</h2>' + finishOpts() : '') + '<h2 style="margin-top:14px">Simulate</h2><div class="ctl">' + locSelect('locS') +
      '<button type="button" data-sim="idle">Skip 3 idle min</button><button type="button" data-sim="fail">Fail next save</button></div><h2 style="margin-top:14px">Away from any place, file to</h2>' + awayOpts() + '<h2 style="margin-top:14px">Open</h2>' + appLinks() + '<div class="btns"><button type="button" class="btn" data-sim="close" style="color:inherit;border-color:currentColor">Done</button></div>';
  }
  function openSheet(open) {
    st.sheet = open; $('sheet').hidden = !open; $('scrim').hidden = !open;
    if (open) { renderSheet(); var c = $('sheet').querySelector('[aria-checked="true"]'); if (c) c.focus(); } else $('setBtn').focus();
  }
  $('setBtn').addEventListener('click', function () { openSheet(true); });
  $('scrim').addEventListener('click', function () { openSheet(false); });
  $('sheet').addEventListener('keydown', function (e) { if (e.key === 'Escape') openSheet(false); });
  document.addEventListener('click', function (e) {
    var tb = e.target.closest('[data-theme-btn]'); if (tb) setTheme(tb.getAttribute('data-theme-btn'), true);
    var fi = e.target.closest('button[data-finish]'); if (fi) { setFinish(fi.dataset.finish); if (st.sheet) renderSheet(); var b3 = document.querySelector((st.sheet ? '#sheet' : '#notes') + ' [data-finish="' + fi.dataset.finish + '"]'); if (b3) b3.focus(); }
    var aw = e.target.closest('[data-away]'); if (aw) { setAway(aw.dataset.away); if (st.sheet) renderSheet(); var b2 = document.querySelector((st.sheet ? '#sheet' : '#notes') + ' [data-away="' + aw.dataset.away + '"]'); if (b2) b2.focus(); }
    var sim = e.target.closest('[data-sim]'); if (!sim) return;
    var k = sim.dataset.sim;
    if (k === 'hold') toggleAll();
    if (k === 'idle') { if (sc().mode !== 'all') flash('Hold the glass first: idle return only applies to “all places”.'); else { clockOffset += S.IDLE_MS; scopeEv({ type: 'tick', now: now() }); flash('3 idle minutes passed: back to ' + sc().label + '.'); } }
    if (k === 'fail') { failNext = true; flash('The next save will fail (mock).'); }
    if (k === 'rm') { document.documentElement.classList.toggle('rm'); reduced = document.documentElement.classList.contains('rm'); lastNotesKey = ''; renderNotes(); }
    if (k === 'close') openSheet(false);
  });
  document.addEventListener('change', function (e) {
    if (!e.target.matches('[data-loc-sel]')) return; var l = LOCS.filter(function (x) { return x.id === e.target.value; })[0];
    if (st.nav.running) { clearInterval(st.nav.timer); st.nav.running = false; }
    var before = sc(); setLoc(l, l.id); if (!sc().filtered && sc().mode === 'here' && sc().away) flash('Away from every place: showing the nearest (' + sc().nearest.short + '), nothing filtered.'); void before;
  });
  window.addEventListener('hashchange', function () { var h = TH.parseHash(location.hash); if (h.finish !== st.finish && h.theme === 'click-wheel') { st.finish = h.finish; document.documentElement.dataset.finish = h.finish; lastNotesKey = ''; } if (h.theme !== st.theme) setTheme(h.theme); else render(); });

  /* fit the device frame to the desktop viewport */
  function fit() { var k = Math.min(1, (window.innerHeight - 40) / 868); $('devWrap').style.setProperty('--k', Math.max(.6, k).toFixed(3)); }
  window.addEventListener('resize', fit); fit();

  /* boot */
  document.documentElement.dataset.theme = st.theme; document.documentElement.dataset.finish = st.finish; buildArt();
  if (hash.raw.menu === '1' && cw()) st.menu = true;
  var fnIdx = FNS.map(function (f) { return f.id; }).indexOf(hash.fn);
  if (fnIdx > 0) { st.idx = fnIdx; st.rot = M.rotationForIndex(fnIdx, N, 0); }
  if (hash.raw.all === '1') st.scope = S.reduce(st.scope, { type: 'hold', now: now() }, places);
  applyRot(); render();
  /* test hook (read-only state + time travel); not used by the UI */
  window.__compass = { state: function () { return { theme: st.theme, idx: st.idx, fn: FNS[st.idx].id, rot: st.rot, scope: sc(), detail: st.detail, nav: { running: st.nav.running, p: st.nav.p }, menu: st.menu, finish: st.finish, voice: !!st.voice, intake: st.intake, cal: st.cal, calDate: st.calDate }; },
    advance: function (ms) { clockOffset += ms; }, adapter: adapter, setTheme: setTheme, select: select, awayFile: function () { return st.awayFile; },
    flick: function () { return coast ? 'coasting' : 'idle'; } };
})();
